<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1620" width="1200" height="1620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <g id="poles">
      <path d="M225,100 L255,100 L259,340 L221,340 Z" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
      <path d="M291,100 L329,100 L325,340 L295,340 Z" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
      <path d="M365,100 L395,100 L399,340 L361,340 Z" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
    </g>
    <g id="clove">
      <path d="M216,266 H264" fill="none" stroke="#7B35C2" stroke-width="6" stroke-linecap="round"/>
      <path d="M264,266 C276,270 276,282 264,286" fill="none" stroke="#7B35C2" stroke-width="6" stroke-linecap="round"/>
      <path d="M216,266 C206,270 206,282 216,286" fill="none" stroke="#4A4A4A" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
      <path d="M216,286 H264" fill="none" stroke="#4A4A4A" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
      <path d="M264,286 C278,290 278,304 264,308" fill="none" stroke="#7B35C2" stroke-width="6" stroke-linecap="round"/>
      <path d="M216,308 H264" fill="none" stroke="#7B35C2" stroke-width="6" stroke-linecap="round"/>
      <path d="M216,308 C204,304 208,294 216,286" fill="none" stroke="#7B35C2" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="wraps">
      <path d="M206,158 H293 M327,158 H414" fill="none" stroke="#7B35C2" stroke-width="5" stroke-linecap="round"/>
      <path d="M206,190 H222 M258,190 H362 M398,190 H414" fill="none" stroke="#7B35C2" stroke-width="5" stroke-linecap="round"/>
      <path d="M206,222 H293 M327,222 H414" fill="none" stroke="#7B35C2" stroke-width="5" stroke-linecap="round"/>
      <path d="M206,254 H222 M258,254 H362 M398,254 H414" fill="none" stroke="#7B35C2" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="frapping">
      <g fill="none" stroke="#7B35C2" stroke-width="4.5">
        <rect x="261" y="144" width="13" height="124" rx="6.5"/>
        <rect x="277" y="144" width="13" height="124" rx="6.5"/>
        <rect x="331" y="144" width="13" height="124" rx="6.5"/>
        <rect x="347" y="144" width="13" height="124" rx="6.5"/>
      </g>
    </g>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07820"/>
    </marker>
  </defs>

  <rect width="1200" height="1620" fill="#F5F2EC"/>
  <text x="40" y="46" font-size="31" font-weight="600" fill="#2D2D2D">Tripod lashing, in five moves</text>

  <!-- ============ 1 ============ -->
  <g transform="translate(0,60)">
    <text x="60" y="20" font-size="22" font-weight="600" fill="#7B35C2">1</text>
    <text x="88" y="20" font-size="22" fill="#2D2D2D">Clove hitch on the left pole</text>
    <use href="#poles"/>
    <use href="#clove"/>
    <path d="M240,314 C232,330 214,342 190,346" fill="none" stroke="#4A4A4A" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="342" font-size="16" fill="#4A4A4A">short tail,</text>
    <text x="60" y="362" font-size="16" fill="#4A4A4A">trapped by the wraps</text>
    <g stroke="#E07820" stroke-width="2.5" fill="none">
      <path d="M448,100 H468"/><path d="M448,286 H468"/>
      <path d="M458,110 V276" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    </g>
    <text x="478" y="188" font-size="16" fill="#E07820">about</text>
    <text x="478" y="208" font-size="16" fill="#E07820">200 mm</text>
    <text x="60" y="404" font-size="17" fill="#4A4A4A">Poles side by side, middle one reversed end</text>
    <text x="60" y="426" font-size="17" fill="#4A4A4A">for end so the butts alternate.</text>
  </g>

  <!-- ============ 2 ============ -->
  <g transform="translate(600,60)">
    <text x="60" y="20" font-size="22" font-weight="600" fill="#7B35C2">2</text>
    <text x="88" y="20" font-size="22" fill="#2D2D2D">Four wrapping turns, woven</text>
    <use href="#poles"/>
    <g opacity="0.4"><use href="#clove"/></g>
    <use href="#wraps"/>
    <text x="430" y="164" font-size="16" fill="#4A4A4A">over &#183; under &#183; over</text>
    <text x="430" y="196" font-size="16" fill="#4A4A4A">under &#183; over &#183; under</text>
    <text x="430" y="228" font-size="16" fill="#4A4A4A">over &#183; under &#183; over</text>
    <text x="430" y="260" font-size="16" fill="#4A4A4A">under &#183; over &#183; under</text>
    <path d="M150,208 L196,208" fill="none" stroke="#E07820" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="60" y="404" font-size="17" fill="#E07820" font-weight="600">Leave a finger of slack in every wrap.</text>
    <text x="60" y="426" font-size="17" fill="#4A4A4A">It is the clearance the legs need to open.</text>
  </g>

  <!-- ============ 3 ============ -->
  <g transform="translate(0,560)">
    <text x="60" y="20" font-size="22" font-weight="600" fill="#7B35C2">3</text>
    <text x="88" y="20" font-size="22" fill="#2D2D2D">Two frapping turns in each gap</text>
    <use href="#poles"/>
    <g opacity="0.4"><use href="#clove"/><use href="#wraps"/></g>
    <use href="#frapping"/>
    <path d="M275,306 L275,278" fill="none" stroke="#E07820" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M345,306 L345,278" fill="none" stroke="#E07820" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="60" y="404" font-size="17" fill="#4A4A4A">Frapping runs at right angles to the wraps</text>
    <text x="60" y="426" font-size="17" fill="#4A4A4A">and squeezes the bundle sideways.</text>
  </g>

  <!-- ============ 4 ============ -->
  <g transform="translate(600,560)">
    <text x="60" y="20" font-size="22" font-weight="600" fill="#7B35C2">4</text>
    <text x="88" y="20" font-size="22" fill="#2D2D2D">Clove hitch on the right pole</text>
    <use href="#poles"/>
    <g opacity="0.4"><use href="#clove"/><use href="#wraps"/><use href="#frapping"/></g>
    <g transform="translate(140,0)"><use href="#clove"/></g>
    <path d="M470,290 L426,290" fill="none" stroke="#E07820" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="480" y="284" font-size="16" fill="#E07820">the tie</text>
    <text x="480" y="304" font-size="16" fill="#E07820">off</text>
    <path d="M380,314 C372,330 354,342 330,346" fill="none" stroke="#4A4A4A" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="404" font-size="17" fill="#4A4A4A">Same hitch as step 1, on the far pole. Dress the</text>
    <text x="60" y="426" font-size="17" fill="#4A4A4A">tail back under the frapping so nothing hangs.</text>
  </g>

  <!-- ============ 5 ============ -->
  <g transform="translate(0,1060)">
    <text x="60" y="20" font-size="22" font-weight="600" fill="#7B35C2">5</text>
    <text x="88" y="20" font-size="22" fill="#2D2D2D">Stand it up and walk the legs open</text>
    <g stroke="#2D2D2D" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M400,110 L232,404"/>
      <path d="M400,110 L568,404"/>
    </g>
    <path d="M400,110 L400,376" stroke="#2D2D2D" stroke-width="3.5" fill="none" stroke-dasharray="9 8" stroke-linecap="round"/>
    <g stroke="#7B35C2" stroke-width="4.5" fill="none" stroke-linecap="round">
      <path d="M358,144 C384,134 416,134 442,144"/>
      <path d="M353,162 C381,152 419,152 447,162"/>
      <path d="M348,180 C378,170 422,170 452,180"/>
    </g>
    <path d="M150,404 H650" stroke="#2D2D2D" stroke-width="3"/>
    <g stroke="#4A4A4A" stroke-width="2">
      <path d="M156,418 L172,404"/><path d="M188,418 L204,404"/><path d="M220,418 L236,404"/>
      <path d="M252,418 L268,404"/><path d="M284,418 L300,404"/><path d="M316,418 L332,404"/>
      <path d="M348,418 L364,404"/><path d="M380,418 L396,404"/><path d="M412,418 L428,404"/>
      <path d="M444,418 L460,404"/><path d="M476,418 L492,404"/><path d="M508,418 L524,404"/>
      <path d="M540,418 L556,404"/><path d="M572,418 L588,404"/><path d="M604,418 L620,404"/>
    </g>
    <path d="M344,214 C318,226 308,246 310,266" fill="none" stroke="#E07820" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M456,214 C482,226 492,246 490,266" fill="none" stroke="#E07820" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M400,214 V262" fill="none" stroke="#E07820" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="720" y="176" font-size="19" fill="#2D2D2D" font-weight="600">The lashing tightens itself</text>
    <text x="720" y="212" font-size="17" fill="#4A4A4A">The middle pole rotates one way inside the</text>
    <text x="720" y="234" font-size="17" fill="#4A4A4A">wraps, the outer two rotate the other, because</text>
    <text x="720" y="256" font-size="17" fill="#4A4A4A">the weave alternates.</text>
    <text x="720" y="294" font-size="17" fill="#4A4A4A">Every wrapping turn shortens as it takes up</text>
    <text x="720" y="316" font-size="17" fill="#4A4A4A">that quarter turn, so the slack you left in</text>
    <text x="720" y="338" font-size="17" fill="#4A4A4A">step 2 is pulled out by the legs opening.</text>
    <text x="720" y="376" font-size="17" fill="#E07820" font-weight="600">Tie the wraps hard and there is nothing left</text>
    <text x="720" y="398" font-size="17" fill="#E07820" font-weight="600">to take up. The legs jam part open.</text>
  </g>
</svg>
