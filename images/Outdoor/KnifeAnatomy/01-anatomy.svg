<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 200 1900 640" width="1900" height="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="200" width="1900" height="640" fill="#F5F2EC"/>

  <!-- blade, shifted right to leave room for a full-length handle -->
  <g transform="translate(240,0)">
    <path d="M560,370 L1000,370 C1200,370 1330,410 1400,455 C1360,500 1260,520 1100,520 L720,520 A20,20 0 0 0 680,520 L560,520 Z"
          fill="#E9E4DA" stroke="#2D2D2D" stroke-width="4" stroke-linejoin="round"/>

    <!-- bevel band -->
    <path d="M720,520 L1100,520 C1260,520 1360,500 1400,455 C1340,478 1250,492 1100,492 L720,492 Z"
          fill="#E07820" fill-opacity="0.55" stroke="#2D2D2D" stroke-width="2"/>
    <line x1="720" y1="492" x2="720" y2="520" stroke="#2D2D2D" stroke-width="2"/>

    <!-- jimping notches -->
    <g fill="#F5F2EC" stroke="#2D2D2D" stroke-width="2">
      <rect x="604" y="370" width="9" height="12"/>
      <rect x="624" y="370" width="9" height="12"/>
      <rect x="644" y="370" width="9" height="12"/>
      <rect x="664" y="370" width="9" height="12"/>
      <rect x="684" y="370" width="9" height="12"/>
      <rect x="704" y="370" width="9" height="12"/>
    </g>

    <!-- choil highlight -->
    <circle cx="700" cy="508" r="30" fill="none" stroke="#7B35C2" stroke-width="5"/>
  </g>

  <!-- handle -->
  <rect x="60" y="340" width="760" height="210" rx="56" fill="#D8D0C0" stroke="#2D2D2D" stroke-width="4"/>
  <circle cx="200" cy="445" r="15" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
  <circle cx="440" cy="445" r="15" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
  <circle cx="680" cy="445" r="15" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>

  <!-- upper leader lines -->
  <g stroke="#4A4A4A" stroke-width="2.5" fill="none">
    <line x1="440" y1="340" x2="440" y2="290"/>
    <line x1="898" y1="370" x2="898" y2="290"/>
    <line x1="1120" y1="370" x2="1120" y2="290"/>
    <line x1="1640" y1="455" x2="1710" y2="455"/>
    <!-- bevel leader, label sits on the blade -->
    <line x1="1480" y1="456" x2="1480" y2="502"/>
    <!-- choil leader -->
    <line x1="940" y1="534" x2="940" y2="760"/>
  </g>
  <circle cx="1640" cy="455" r="6" fill="#2D2D2D"/>

  <!-- handle pin leaders -->
  <g stroke="#4A4A4A" stroke-width="2.5" fill="none">
    <line x1="200" y1="462" x2="200" y2="600"/>
    <line x1="440" y1="462" x2="440" y2="600"/>
    <line x1="680" y1="462" x2="680" y2="600"/>
    <line x1="200" y1="600" x2="680" y2="600"/>
    <line x1="440" y1="600" x2="440" y2="640"/>
  </g>

  <!-- region brackets under the blade -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <!-- ricasso -->
    <path d="M822,562 L822,578 L918,578 L918,562" stroke="#4A4A4A"/>
    <!-- heel -->
    <path d="M962,562 L962,578 L1180,578 L1180,562" stroke="#2D2D2D"/>
    <!-- belly -->
    <path d="M1340,562 L1340,578 L1636,578 L1636,562" stroke="#2D2D2D"/>
    <!-- whole edge -->
    <path d="M962,632 L962,648 L1636,648 L1636,632" stroke="#E07820"/>
  </g>
  <!-- dotted guides from the blade down to the whole-edge bracket -->
  <g stroke="#4A4A4A" stroke-width="1.5" stroke-dasharray="4 6" fill="none">
    <line x1="962" y1="520" x2="962" y2="562"/>
    <line x1="1180" y1="520" x2="1180" y2="562"/>
    <line x1="1340" y1="520" x2="1340" y2="562"/>
    <line x1="1636" y1="470" x2="1636" y2="562"/>
  </g>

  <!-- labels -->
  <g font-size="34" font-weight="600" fill="#2D2D2D" text-anchor="middle">
    <text x="440" y="268">Handle</text>
    <text x="440" y="680">Pins</text>
    <text x="898" y="268">Jimping</text>
    <text x="1120" y="268">Spine</text>
    <text x="856" y="626">Ricasso</text>
    <text x="1071" y="626">Heel</text>
    <text x="1488" y="626">Belly</text>
    <text x="1300" y="702" fill="#E07820">Edge</text>
    <text x="940" y="800" fill="#7B35C2">Choil</text>
    <text x="1480" y="438" fill="#9A4A00">Bevel</text>
  </g>
  <text x="1725" y="467" font-size="34" font-weight="600" fill="#2D2D2D">Point</text>
</svg>
