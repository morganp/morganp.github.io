<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 810" width="1280" height="810">
  <style>
    .bg   { fill: #F5F2EC; }
    .wood { fill: none; stroke: #2D2D2D; stroke-width: 3.5; stroke-linejoin: round; }
    .blade{ fill: none; stroke: #2D2D2D; stroke-width: 3; }
    .teeth{ fill: none; stroke: #2D2D2D; stroke-width: 4; stroke-dasharray: 5 5; }
    .str  { fill: none; stroke: #7B35C2; stroke-width: 3.5; stroke-linejoin: round; }
    .cord { fill: none; stroke: #E07820; stroke-width: 3; }
    .tog  { fill: none; stroke: #E07820; stroke-width: 6; stroke-linecap: round; }
    .pin  { fill: #E07820; stroke: #2D2D2D; stroke-width: 2; }
    .dim  { fill: none; stroke: #4A4A4A; stroke-width: 1.6; }
    .ext  { fill: none; stroke: #4A4A4A; stroke-width: 1; stroke-dasharray: 4 4; }
    text  { font-family: Helvetica, Arial, sans-serif; fill: #2D2D2D; }
    .lbl  { font-size: 21px; }
    .dtx  { font-size: 20px; fill: #4A4A4A; }
    .key  { font-size: 21px; fill: #7B35C2; }
    .key2 { font-size: 21px; fill: #E07820; }
    .ttl  { font-size: 25px; font-weight: bold; }
  </style>

  <rect class="bg" x="0" y="0" width="1280" height="810"/>
  <text class="ttl" x="40" y="46">Assembled frame, 610 mm blade</text>
  <text class="dtx" x="40" y="76">All dimensions in millimetres. Arms drawn vertical; under tension they lean in slightly.</text>

  <!-- arms -->
  <rect class="wood" x="74"   y="148" width="72" height="504" rx="5"/>
  <rect class="wood" x="1029" y="148" width="72" height="504" rx="5"/>

  <!-- blade kerf inside each arm, dashed -->
  <line class="ext" x1="110"  y1="158" x2="110"  y2="640"/>
  <line class="ext" x1="1065" y1="158" x2="1065" y2="640"/>

  <!-- cord notches -->
  <path class="wood" d="M 74 162 q 12 10 0 20"/>
  <path class="wood" d="M 1101 162 q -12 10 0 20"/>

  <!-- blade -->
  <rect class="blade" x="110" y="600" width="955" height="40"/>
  <line class="teeth" x1="112" y1="638" x2="1063" y2="638"/>

  <!-- captive pins -->
  <circle class="pin" cx="110"  cy="620" r="9"/>
  <circle class="pin" cx="1065" cy="620" r="9"/>

  <!-- stretcher -->
  <rect class="str" x="130" y="334" width="915" height="32" rx="3"/>
  <line class="str" x1="146"  y1="334" x2="146"  y2="366"/>
  <line class="str" x1="1029" y1="334" x2="1029" y2="366"/>

  <!-- windlass cord and toggle -->
  <path class="cord" d="M 78 172 L 560 158 M 614 158 L 1097 172"/>
  <path class="cord" d="M 78 180 L 560 194 M 614 194 L 1097 180"/>
  <path class="cord" d="M 560 158 L 614 194 M 560 194 L 614 158"/>
  <line class="tog" x1="556" y1="92" x2="618" y2="262"/>

  <!-- overall blade span dimension -->
  <line class="ext" x1="110"  y1="644" x2="110"  y2="716"/>
  <line class="ext" x1="1065" y1="644" x2="1065" y2="716"/>
  <line class="dim" x1="110"  y1="704" x2="1065" y2="704"/>
  <line class="dim" x1="110"  y1="696" x2="110"  y2="712"/>
  <line class="dim" x1="1065" y1="696" x2="1065" y2="712"/>
  <rect class="bg" x="470" y="688" width="236" height="28"/>
  <text class="dtx" x="588" y="710" text-anchor="middle">597 eyelet to eyelet</text>

  <!-- arm overall length, far left -->
  <line class="ext" x1="40" y1="148" x2="70" y2="148"/>
  <line class="ext" x1="40" y1="652" x2="70" y2="652"/>
  <line class="dim" x1="52" y1="148" x2="52" y2="652"/>
  <line class="dim" x1="44" y1="148" x2="60" y2="148"/>
  <line class="dim" x1="44" y1="652" x2="60" y2="652"/>
  <rect class="bg" x="38" y="358" width="28" height="86"/>
  <text class="dtx" x="52" y="401" text-anchor="middle" transform="rotate(-90 52 401)">315 arm</text>

  <!-- throat depth -->
  <line class="ext" x1="150" y1="366" x2="256" y2="366"/>
  <line class="ext" x1="150" y1="600" x2="256" y2="600"/>
  <line class="dim" x1="244" y1="366" x2="244" y2="600"/>
  <line class="dim" x1="236" y1="366" x2="252" y2="366"/>
  <line class="dim" x1="236" y1="600" x2="252" y2="600"/>
  <rect class="bg" x="230" y="414" width="28" height="138"/>
  <text class="key" x="244" y="483" text-anchor="middle" transform="rotate(-90 244 483)">146 throat</text>

  <!-- lever arms, right side -->
  <line class="ext" x1="1105" y1="172" x2="1200" y2="172"/>
  <line class="ext" x1="1105" y1="350" x2="1200" y2="350"/>
  <line class="ext" x1="1105" y1="620" x2="1200" y2="620"/>
  <line class="dim" x1="1188" y1="172" x2="1188" y2="350"/>
  <line class="dim" x1="1180" y1="172" x2="1196" y2="172"/>
  <line class="dim" x1="1180" y1="350" x2="1196" y2="350"/>
  <rect class="bg" x="1174" y="238" width="28" height="46"/>
  <text class="key2" x="1188" y="261" text-anchor="middle" transform="rotate(-90 1188 261)">111</text>
  <line class="dim" x1="1188" y1="350" x2="1188" y2="620"/>
  <line class="dim" x1="1180" y1="620" x2="1196" y2="620"/>
  <rect class="bg" x="1174" y="462" width="28" height="46"/>
  <text class="key2" x="1188" y="485" text-anchor="middle" transform="rotate(-90 1188 485)">169</text>
  <text class="dtx" x="1212" y="392">lever</text>
  <text class="dtx" x="1212" y="416">arms</text>

  <!-- labels -->
  <text class="lbl"  x="38"  y="128">arm</text>
  <line class="dim"  x1="78" y1="120" x2="104" y2="150"/>
  <text class="key"  x="654" y="322">stretcher</text>
  <text class="key2" x="654" y="132">windlass cord</text>
  <text class="key2" x="404" y="246" text-anchor="end">toggle</text>
  <line class="dim"  x1="412" y1="239" x2="572" y2="205"/>
  <text class="lbl"  x="672" y="676">blade, teeth down</text>
  <line class="dim"  x1="736" y1="662" x2="736" y2="644"/>
  <text class="key2" x="150" y="768">captive pin, blade never comes off</text>
  <line class="dim"  x1="146" y1="760" x2="108" y2="632"/>
</svg>
