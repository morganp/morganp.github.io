<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1200" height="660" fill="#F5F2EC"/>
<text x="50" y="46" font-size="26" font-weight="bold" fill="#2D2D2D">The two switches, and the thing each one is good at</text>
<text x="50" y="74" font-size="17" fill="#4A4A4A">nMOS pulls down to ground, pMOS pulls up to the supply. Every static CMOS gate follows from that.</text>
<rect x="50" y="105" width="540" height="495" rx="14" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>
<text x="320" y="145" font-size="22" fill="#2D2D2D" text-anchor="middle" font-weight="bold">nMOS</text>
<g stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M 268 270 L 300 270"/>
<path d="M 300 246 L 300 294"/>
<path d="M 313 246 L 313 294"/>
<path d="M 313 253 L 330 253 L 330 230"/>
<path d="M 313 287 L 330 287 L 330 310"/>
</g>
<path d="M 330 230 L 330 180" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="348" y="178" font-size="16" fill="#4A4A4A" text-anchor="start">to the output node</text>
<path d="M 330 310 L 330 380" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 300 380 L 360 380" stroke="#2D2D2D" stroke-width="4"/>
<text x="288" y="386" font-size="18" fill="#2D2D2D" text-anchor="end" font-weight="bold"></text>
<path d="M 310 392 L 350 392" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 320 404 L 340 404" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="330" y="432" font-size="16" fill="#2D2D2D" text-anchor="middle">GND</text>
<path d="M 268 270 L 200 270" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="192" y="276" font-size="17" fill="#4A4A4A" text-anchor="end">gate</text>
<text x="80" y="490" font-size="17" fill="#2D2D2D" text-anchor="start">Conducts when the gate is <tspan font-weight="bold">high</tspan></text>
<text x="80" y="520" font-size="17" fill="#2D2D2D" text-anchor="start">Pulls the output down to a solid 0</text>
<text x="80" y="550" font-size="17" fill="#E07820" text-anchor="start">Pulling up, it stops a threshold short of the supply</text>
<rect x="610" y="105" width="540" height="495" rx="14" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>
<text x="880" y="145" font-size="22" fill="#2D2D2D" text-anchor="middle" font-weight="bold">pMOS</text>
<g stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M 828 310 L 846 310"/>
<circle cx="853" cy="310" r="7" fill="#F5F2EC"/>
<path d="M 860 286 L 860 334"/>
<path d="M 873 286 L 873 334"/>
<path d="M 873 293 L 890 293 L 890 270"/>
<path d="M 873 327 L 890 327 L 890 350"/>
</g>
<path d="M 890 270 L 890 200" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 860 200 L 920 200" stroke="#2D2D2D" stroke-width="4"/>
<text x="848" y="206" font-size="18" fill="#2D2D2D" text-anchor="end" font-weight="bold"></text>
<text x="890" y="182" font-size="16" fill="#2D2D2D" text-anchor="middle">VDD</text>
<path d="M 890 350 L 890 400" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="908" y="404" font-size="16" fill="#4A4A4A" text-anchor="start">to the output node</text>
<path d="M 828 310 L 760 310" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="752" y="316" font-size="17" fill="#4A4A4A" text-anchor="end">gate</text>
<text x="640" y="490" font-size="17" fill="#2D2D2D" text-anchor="start">Conducts when the gate is <tspan font-weight="bold">low</tspan></text>
<text x="640" y="520" font-size="17" fill="#2D2D2D" text-anchor="start">Pulls the output up to a solid 1</text>
<text x="640" y="550" font-size="17" fill="#E07820" text-anchor="start">Pulling down, it stops a threshold above ground</text>
<rect x="50" y="620" width="1100" height="0" fill="none"/>
<text x="50" y="640" font-size="17" fill="#7B35C2" text-anchor="start">So: nMOS transistors only ever sit between the output and ground, pMOS transistors only ever between the output and the supply.</text>
</svg>