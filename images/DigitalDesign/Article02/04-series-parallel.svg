<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1200" height="620" fill="#F5F2EC"/>
<text x="50" y="46" font-size="26" font-weight="bold" fill="#2D2D2D">Switches in series are AND, switches in parallel are OR</text>
<text x="50" y="74" font-size="17" fill="#4A4A4A">The pull-down network computes a function, and the act of conducting inverts it.</text>
<rect x="40" y="105" width="550" height="400" rx="14" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>
<text x="315" y="145" font-size="22" fill="#2D2D2D" text-anchor="middle" font-weight="bold">Series</text>
<path d="M 300 180 L 300 204" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 300 260 L 300 236" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="300" cy="204" r="5" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
<circle cx="300" cy="236" r="5" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
<path d="M 322 198 L 300 236" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="284" y="226" font-size="18" fill="#2D2D2D" text-anchor="end" font-weight="bold">A</text>
<path d="M 300 300 L 300 324" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 300 380 L 300 356" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="300" cy="324" r="5" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
<circle cx="300" cy="356" r="5" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
<path d="M 322 318 L 300 356" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="284" y="346" font-size="18" fill="#2D2D2D" text-anchor="end" font-weight="bold">B</text>
<path d="M 300 180 L 300 190" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 300 260 L 300 300" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 300 380 L 300 400" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 268 400 L 332 400" stroke="#2D2D2D" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 280 412 L 320 412" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 291 424 L 309 424" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 300 180 L 400 180" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="410" y="186" font-size="16" fill="#4A4A4A" text-anchor="start">output node</text>
<text x="70" y="455" font-size="17" fill="#2D2D2D" text-anchor="start">Conducts only when A <tspan font-weight="bold">and</tspan> B are both on.</text>
<text x="70" y="483" font-size="17" fill="#E07820" text-anchor="start">In the pull-up network this becomes parallel.</text>
<rect x="610" y="105" width="550" height="400" rx="14" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>
<text x="885" y="145" font-size="22" fill="#2D2D2D" text-anchor="middle" font-weight="bold">Parallel</text>
<path d="M 860 240 L 860 264" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 860 320 L 860 296" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="860" cy="264" r="5" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
<circle cx="860" cy="296" r="5" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
<path d="M 882 258 L 860 296" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="844" y="286" font-size="18" fill="#2D2D2D" text-anchor="end" font-weight="bold">A</text>
<path d="M 1010 240 L 1010 264" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1010 320 L 1010 296" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1010" cy="264" r="5" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
<circle cx="1010" cy="296" r="5" fill="#F5F2EC" stroke="#2D2D2D" stroke-width="3"/>
<path d="M 1032 258 L 1010 296" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="994" y="286" font-size="18" fill="#2D2D2D" text-anchor="end" font-weight="bold">B</text>
<path d="M 860 240 L 860 200" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1010 240 L 1010 200" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 860 200 L 1010 200" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="860" cy="200" r="6" fill="#2D2D2D"/>
<circle cx="1010" cy="200" r="6" fill="#2D2D2D"/>
<path d="M 860 320 L 860 380" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1010 320 L 1010 380" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 860 380 L 1010 380" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="860" cy="380" r="6" fill="#2D2D2D"/>
<circle cx="1010" cy="380" r="6" fill="#2D2D2D"/>
<path d="M 935 380 L 935 400" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 903 400 L 967 400" stroke="#2D2D2D" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 915 412 L 955 412" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 926 424 L 944 424" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 860 200 L 790 200" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="782" y="206" font-size="16" fill="#4A4A4A" text-anchor="end">output node</text>
<text x="640" y="455" font-size="17" fill="#2D2D2D" text-anchor="start">Conducts when A <tspan font-weight="bold">or</tspan> B is on.</text>
<text x="640" y="483" font-size="17" fill="#E07820" text-anchor="start">In the pull-up network this becomes series.</text>
<text x="40" y="555" font-size="17" fill="#7B35C2" text-anchor="start">Conducting pulls the output to ground, so the gate output is the inverse of whatever the pull-down network conducts for:</text>
<text x="40" y="590" font-size="18" fill="#7B35C2" text-anchor="start" font-weight="bold">Y = NOT ( the pull-down function ).  Series and parallel give AND and OR, and the output node supplies the NOT for free.</text>
</svg>