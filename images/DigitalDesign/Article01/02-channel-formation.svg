<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 580" width="1020" height="580" font-family="Helvetica, Arial, sans-serif">
<rect width="1020" height="580" fill="#F5F2EC"/>
<text x="50" y="44" font-size="26" font-weight="bold" fill="#2D2D2D">How the gate voltage makes a channel</text>
<text x="50" y="72" font-size="17" fill="#4A4A4A">An nMOS in cross-section. The gate never passes current. It builds a conducting layer underneath the oxide.</text>
<rect x="80" y="180" width="60" height="250" rx="6" fill="none" stroke="#4A4A4A" stroke-width="2"/>
<rect x="80" y="230" width="60" height="200" rx="6" fill="#E07820" opacity="0.85"><animate attributeName="height" dur="12s" repeatCount="indefinite" values="0;0;90;90;200;200;200" keyTimes="0;0.22;0.30;0.48;0.56;0.99;1" /><animate attributeName="y" dur="12s" repeatCount="indefinite" values="430;430;340;340;230;230;230" keyTimes="0;0.22;0.30;0.48;0.56;0.99;1" /></rect>
<line x1="70" y1="320" x2="150" y2="320" stroke="#7B35C2" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="62" y="325" font-size="15" fill="#7B35C2" text-anchor="end">threshold</text>
<text x="110" y="468" font-size="17" fill="#2D2D2D" text-anchor="middle" font-weight="bold">gate voltage</text>
<text x="150" y="437" font-size="14" fill="#4A4A4A">0 V</text>
<rect x="250" y="250" width="690" height="180" fill="#DCD6CB" stroke="#2D2D2D" stroke-width="2"/>
<text x="268" y="415" font-size="16" fill="#4A4A4A">p-type substrate, full of holes</text>
<rect x="280" y="250" width="130" height="72" fill="#8FBFD8" stroke="#2D2D2D" stroke-width="2"/>
<rect x="780" y="250" width="130" height="72" fill="#8FBFD8" stroke="#2D2D2D" stroke-width="2"/>
<text x="345" y="292" font-size="16" fill="#2D2D2D" text-anchor="middle">source n+</text>
<text x="845" y="292" font-size="16" fill="#2D2D2D" text-anchor="middle">drain n+</text>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.000;0.240;0.250;0.500;0.510;1.000" /><rect x="410" y="252" width="370" height="52" fill="#EFEAE0" stroke="#4A4A4A" stroke-width="1.5" stroke-dasharray="6 4"/><text x="595" y="286" font-size="15" fill="#4A4A4A" text-anchor="middle">holes pushed away: depletion, still no path</text></g>
<g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0.000;0.250;0.260;1.000" /><text x="428" y="278" font-size="19" fill="#4A4A4A" text-anchor="middle">+</text><text x="461" y="278" font-size="19" fill="#4A4A4A" text-anchor="middle">+</text><text x="495" y="278" font-size="19" fill="#4A4A4A" text-anchor="middle">+</text><text x="528" y="278" font-size="19" fill="#4A4A4A" text-anchor="middle">+</text><text x="562" y="278" font-size="19" fill="#4A4A4A" text-anchor="middle">+</text><text x="595" y="278" font-size="19" fill="#4A4A4A" text-anchor="middle">+</text><text x="628" y="278" font-size="19" fill="#4A4A4A" text-anchor="middle">+</text><text x="662" y="278" font-size="19" fill="#4A4A4A" text-anchor="middle">+</text><text x="695" y="278" font-size="19" fill="#4A4A4A" text-anchor="middle">+</text><text x="729" y="278" font-size="19" fill="#4A4A4A" text-anchor="middle">+</text><text x="762" y="278" font-size="19" fill="#4A4A4A" text-anchor="middle">+</text></g>
<g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0.000;0.490;0.500;1.000" /><rect x="410" y="252" width="370" height="26" fill="#8FBFD8" stroke="#2D2D2D" stroke-width="1.5"/><text x="520" y="272" font-size="19" fill="#F5F2EC" text-anchor="middle">-</text><text x="544" y="272" font-size="19" fill="#F5F2EC" text-anchor="middle">-</text><text x="568" y="272" font-size="19" fill="#F5F2EC" text-anchor="middle">-</text><text x="592" y="272" font-size="19" fill="#F5F2EC" text-anchor="middle">-</text><text x="616" y="272" font-size="19" fill="#F5F2EC" text-anchor="middle">-</text><text x="640" y="272" font-size="19" fill="#F5F2EC" text-anchor="middle">-</text><text x="664" y="272" font-size="19" fill="#F5F2EC" text-anchor="middle">-</text><text x="688" y="272" font-size="19" fill="#F5F2EC" text-anchor="middle">-</text><text x="712" y="272" font-size="19" fill="#F5F2EC" text-anchor="middle">-</text><text x="736" y="272" font-size="19" fill="#F5F2EC" text-anchor="middle">-</text><text x="760" y="272" font-size="19" fill="#F5F2EC" text-anchor="middle">-</text><text x="595" y="270" font-size="15" fill="#2D2D2D" text-anchor="middle" opacity="0"> </text><text x="422" y="272" font-size="15" fill="#2D2D2D">channel</text></g>
<rect x="410" y="238" width="370" height="12" fill="#E07820" stroke="#2D2D2D" stroke-width="1.5"/>
<path d="M 786 244 L 820 214" stroke="#E07820" stroke-width="2" fill="none"/>
<text x="826" y="212" font-size="15" fill="#E07820">gate oxide, an insulator</text>
<rect x="410" y="196" width="370" height="42" fill="#7B35C2" stroke="#2D2D2D" stroke-width="2"/>
<text x="595" y="223" font-size="17" fill="#F5F2EC" text-anchor="middle">gate</text>
<path d="M 110 180 L 110 150 L 595 150 L 595 196" stroke="#E07820" stroke-width="3" fill="none"/>
<g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0.000;0.740;0.750;1.000" /><path d="M 420 296 L 740 296" stroke="#E07820" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="18 14"><animate attributeName="stroke-dashoffset" dur="0.8s" repeatCount="indefinite" values="64;0"/></path><path d="M 734 284 L 766 296 L 734 308 Z" fill="#E07820"/><text x="595" y="336" font-size="16" fill="#E07820" text-anchor="middle" font-weight="bold">electrons drift from source to drain</text><text x="595" y="358" font-size="14" fill="#4A4A4A" text-anchor="middle">conventional current runs the opposite way, drain to source</text></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0.000;0.250;0.260;1.000" /><text x="50" y="500" font-size="18" fill="#2D2D2D">Gate at 0 V. Holes sit at the surface, the two n+ regions are isolated, and no current can flow.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.000;0.240;0.250;0.500;0.510;1.000" /><text x="50" y="500" font-size="18" fill="#2D2D2D">Gate rising, still below the threshold. Holes are pushed down into the substrate, leaving a depleted layer.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.000;0.490;0.500;0.750;0.760;1.000" /><text x="50" y="500" font-size="18" fill="#2D2D2D">Gate above the threshold. Electrons are pulled to the surface and invert it into n-type silicon.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0.000;0.740;0.750;1.000" /><text x="50" y="500" font-size="18" fill="#2D2D2D">The channel now joins source to drain. The transistor is on, and it is on because of a voltage, not a current.</text></g>
<text x="50" y="545" font-size="16" fill="#4A4A4A">Remove the gate voltage and the channel disappears within picoseconds. That is the switch.</text>
</svg>