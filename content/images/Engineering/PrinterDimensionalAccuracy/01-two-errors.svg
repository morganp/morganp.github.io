<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07820"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B35C2"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#4A4A4A" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" fill="#F5F2EC"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#2D2D2D">

    <text x="40" y="56" font-size="24" font-weight="600">A base that spreads</text>
    <text x="640" y="56" font-size="24" font-weight="600">A hole that shrinks</text>
    <line x1="600" y1="90" x2="600" y2="500" stroke="#4A4A4A" stroke-width="1" stroke-dasharray="4 6"/>

    <!-- Panel A: first layer squash in cross section -->
    <g>
      <rect x="190" y="326" width="140" height="26" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
      <rect x="190" y="352" width="140" height="26" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
      <rect x="190" y="378" width="140" height="26" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
      <rect x="176" y="404" width="168" height="26" fill="#EAE3D5" stroke="#2D2D2D" stroke-width="2"/>

      <line x1="100" y1="430" x2="440" y2="430" stroke="#2D2D2D" stroke-width="3"/>
      <rect x="100" y="431" width="340" height="14" fill="url(#hatch)" opacity="0.55"/>
      <text x="100" y="474" font-size="17" fill="#4A4A4A">build plate</text>

      <line x1="190" y1="300" x2="190" y2="446" stroke="#4A4A4A" stroke-width="1.5" stroke-dasharray="6 5"/>
      <line x1="330" y1="300" x2="330" y2="446" stroke="#4A4A4A" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="196" y="294" font-size="17" fill="#4A4A4A">wall face in CAD</text>

      <line x1="250" y1="500" x2="180" y2="436" stroke="#E07820" stroke-width="2" marker-end="url(#arrO)"/>
      <text x="258" y="506" font-size="18" fill="#E07820">layer 1 spreads 0.1 to 0.3mm</text>

      <line x1="380" y1="380" x2="346" y2="410" stroke="#7B35C2" stroke-width="2" marker-end="url(#arrP)"/>
      <text x="388" y="352" font-size="18" fill="#7B35C2">compensation shrinks</text>
      <text x="388" y="374" font-size="18" fill="#7B35C2">this layer and no other</text>

      <text x="100" y="150" font-size="18" fill="#2D2D2D">Nozzle pressure and a hot plate push the</text>
      <text x="100" y="174" font-size="18" fill="#2D2D2D">first layer sideways, so the base measures</text>
      <text x="100" y="198" font-size="18" fill="#2D2D2D">wider than every layer above it.</text>
    </g>

    <!-- Panel B: chord error and inward crowding on a hole -->
    <g>
      <circle cx="860" cy="370" r="110" fill="none" stroke="#7B35C2" stroke-width="2" stroke-dasharray="7 6"/>
      <polygon points="961.6,412.1 902.1,471.6 817.9,471.6 758.4,412.1 758.4,327.9 817.9,268.4 902.1,268.4 961.6,327.9"
               fill="none" stroke="#2D2D2D" stroke-width="11" stroke-linejoin="round" opacity="0.9"/>

      <line x1="758.4" y1="370" x2="961.6" y2="370" stroke="#7B35C2" stroke-width="2" marker-start="url(#arrP)" marker-end="url(#arrP)"/>
      <text x="795" y="392" font-size="18" fill="#7B35C2">measured</text>

      <line x1="750" y1="228" x2="970" y2="228" stroke="#4A4A4A" stroke-width="1.5" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
      <line x1="750" y1="228" x2="750" y2="262" stroke="#4A4A4A" stroke-width="1" stroke-dasharray="5 4"/>
      <line x1="970" y1="228" x2="970" y2="262" stroke="#4A4A4A" stroke-width="1" stroke-dasharray="5 4"/>
      <text x="828" y="218" font-size="18" fill="#4A4A4A">nominal</text>

      <line x1="1020" y1="296" x2="968" y2="318" stroke="#E07820" stroke-width="2" marker-end="url(#arrO)"/>
      <text x="1000" y="268" font-size="18" fill="#E07820">extrusion crowds</text>
      <text x="1000" y="290" font-size="18" fill="#E07820">the inside of a curve</text>

      <line x1="690" y1="470" x2="762" y2="440" stroke="#4A4A4A" stroke-width="2" marker-end="url(#arrG)"/>
      <text x="640" y="496" font-size="18" fill="#4A4A4A">toolpath chords fall inside the circle</text>

      <text x="640" y="150" font-size="18" fill="#2D2D2D">Both errors run in the same direction, so a</text>
      <text x="640" y="174" font-size="18" fill="#2D2D2D">hole finishes 0.1 to 0.2mm under its nominal</text>
      <text x="640" y="198" font-size="18" fill="#2D2D2D">diameter, and a small hole suffers most.</text>
    </g>
  </g>
</svg>
