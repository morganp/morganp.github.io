<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="780" fill="#F5F2EC"/>

  <text x="60" y="46" font-size="26" font-weight="bold" fill="#2D2D2D">CMOS inverter cross-section, and the mask that makes each feature</text>
  <text x="60" y="74" font-size="17" fill="#4A4A4A">Vertical scale exaggerated. Numbers refer to the mask sequence in the text.</text>

  <!-- substrate -->
  <rect x="60" y="380" width="1080" height="220" fill="#DCD6CB" stroke="#2D2D2D" stroke-width="2"/>
  <text x="90" y="560" font-size="19" fill="#4A4A4A">p-type silicon substrate</text>

  <!-- n-well -->
  <path d="M 620 380 L 1140 380 L 1140 540 Q 880 570 620 540 Z" fill="#C9C0F0" stroke="#2D2D2D" stroke-width="2"/>
  <text x="820" y="520" font-size="19" fill="#4A4A4A">n-well</text>

  <!-- STI trenches -->
  <g fill="#B9B2A6" stroke="#2D2D2D" stroke-width="2">
    <rect x="60" y="380" width="80" height="54"/>
    <rect x="380" y="380" width="320" height="54"/>
    <rect x="940" y="380" width="200" height="54"/>
  </g>
  <text x="450" y="414" font-size="16" fill="#2D2D2D">shallow trench isolation</text>

  <!-- nMOS diffusions -->
  <g stroke="#2D2D2D" stroke-width="2">
    <rect x="140" y="380" width="95" height="46" fill="#8FBFD8"/>
    <rect x="285" y="380" width="95" height="46" fill="#8FBFD8"/>
  </g>
  <text x="150" y="410" font-size="16" fill="#2D2D2D">n+</text>
  <text x="295" y="410" font-size="16" fill="#2D2D2D">n+</text>

  <!-- pMOS diffusions -->
  <g stroke="#2D2D2D" stroke-width="2">
    <rect x="700" y="380" width="95" height="46" fill="#E8B98A"/>
    <rect x="845" y="380" width="95" height="46" fill="#E8B98A"/>
  </g>
  <text x="710" y="410" font-size="16" fill="#2D2D2D">p+</text>
  <text x="855" y="410" font-size="16" fill="#2D2D2D">p+</text>

  <!-- gate oxide -->
  <rect x="230" y="372" width="60" height="8" fill="#E07820" stroke="#2D2D2D" stroke-width="1"/>
  <rect x="790" y="372" width="60" height="8" fill="#E07820" stroke="#2D2D2D" stroke-width="1"/>

  <!-- poly gates -->
  <rect x="225" y="330" width="70" height="42" fill="#7B35C2" stroke="#2D2D2D" stroke-width="2"/>
  <rect x="785" y="330" width="70" height="42" fill="#7B35C2" stroke="#2D2D2D" stroke-width="2"/>
  <text x="260" y="356" font-size="15" fill="#F5F2EC" text-anchor="middle">poly</text>
  <text x="820" y="356" font-size="15" fill="#F5F2EC" text-anchor="middle">poly</text>

  <!-- channel length marker -->
  <g stroke="#E07820" stroke-width="2">
    <line x1="230" y1="452" x2="230" y2="480"/>
    <line x1="290" y1="452" x2="290" y2="480"/>
    <line x1="230" y1="470" x2="290" y2="470" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <text x="260" y="500" font-size="16" fill="#E07820" text-anchor="middle">channel length</text>
  <text x="260" y="520" font-size="14" fill="#4A4A4A" text-anchor="middle">the number the node is named after</text>

  <!-- contacts -->
  <g fill="#4A4A4A" stroke="#2D2D2D" stroke-width="2">
    <rect x="177" y="270" width="22" height="112"/>
    <rect x="322" y="270" width="22" height="112"/>
    <rect x="737" y="270" width="22" height="112"/>
    <rect x="882" y="270" width="22" height="112"/>
  </g>

  <!-- ILD outline -->
  <rect x="60" y="270" width="1080" height="110" fill="none" stroke="#4A4A4A" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="430" y="312" font-size="16" fill="#4A4A4A">inter-layer dielectric</text>

  <!-- metal 1 -->
  <g fill="#2D2D2D">
    <rect x="140" y="238" width="100" height="32" rx="4"/>
    <rect x="300" y="238" width="490" height="32" rx="4"/>
    <rect x="850" y="238" width="170" height="32" rx="4"/>
  </g>
  <text x="190" y="260" font-size="16" fill="#F5F2EC" text-anchor="middle">GND</text>
  <text x="545" y="260" font-size="16" fill="#F5F2EC" text-anchor="middle">metal 1, output node</text>
  <text x="935" y="260" font-size="16" fill="#F5F2EC" text-anchor="middle">VDD</text>

  <!-- input arrow to gates -->
  <g stroke="#E07820" stroke-width="3" fill="none">
    <path d="M 130 175 L 820 175"/>
    <path d="M 260 175 L 260 330"/>
    <path d="M 820 175 L 820 330"/>
  </g>
  <text x="90" y="181" font-size="18" fill="#E07820" text-anchor="middle">IN</text>
  <text x="300" y="150" font-size="15" fill="#4A4A4A">both gates driven from the same input, on a higher metal layer</text>

  <!-- device labels -->
  <text x="260" y="640" font-size="20" font-weight="bold" fill="#2D2D2D" text-anchor="middle">nMOS</text>
  <text x="260" y="664" font-size="15" fill="#4A4A4A" text-anchor="middle">pull-down, source to GND</text>
  <text x="820" y="640" font-size="20" font-weight="bold" fill="#2D2D2D" text-anchor="middle">pMOS in the n-well</text>
  <text x="820" y="664" font-size="15" fill="#4A4A4A" text-anchor="middle">pull-up, source to VDD</text>

  <!-- callout badges -->
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <circle cx="1010" cy="470" r="17" fill="#7B35C2"/><text x="1010" y="476" fill="#F5F2EC">1</text>
    <circle cx="665" cy="407" r="17" fill="#7B35C2"/><text x="665" y="413" fill="#F5F2EC">2</text>
    <circle cx="260" cy="305" r="17" fill="#7B35C2"/><text x="260" y="311" fill="#F5F2EC">3</text>
    <circle cx="187" cy="440" r="17" fill="#7B35C2"/><text x="187" y="446" fill="#F5F2EC">4</text>
    <circle cx="893" cy="440" r="17" fill="#7B35C2"/><text x="893" y="446" fill="#F5F2EC">5</text>
    <circle cx="333" cy="300" r="17" fill="#7B35C2"/><text x="333" y="306" fill="#F5F2EC">6</text>
    <circle cx="1050" cy="254" r="17" fill="#7B35C2"/><text x="1050" y="260" fill="#F5F2EC">7</text>
  </g>

  <!-- legend -->
  <line x1="60" y1="690" x2="1140" y2="690" stroke="#4A4A4A" stroke-width="1.5"/>
  <g font-size="16" fill="#2D2D2D">
    <text x="60" y="718">1  n-well implant</text>
    <text x="270" y="718">2  active and trench isolation</text>
    <text x="600" y="718">3  polysilicon gate</text>
    <text x="840" y="718">4  n+ source and drain</text>
    <text x="60" y="746">5  p+ source and drain</text>
    <text x="270" y="746">6  contact</text>
    <text x="600" y="746">7  metal 1, then one mask per via and metal above it</text>
  </g>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 0 4 L 8 1 L 8 7 Z" fill="#E07820"/>
    </marker>
  </defs>
</svg>
