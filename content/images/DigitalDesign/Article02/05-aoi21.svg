<text x="90" y="126" font-size="19" fill="#2D2D2D" text-anchor="end" font-weight="bold">A</text>
<path d="M 150 230 L 238 230" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 150 520 L 238 520" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 150 230 L 150 520" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="140" y="236" font-size="19" fill="#2D2D2D" text-anchor="end" font-weight="bold">B</text>
<path d="M 432 380 L 650 380" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 532 560 L 650 560" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 650 380 L 650 560" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="660" y="476" font-size="19" fill="#2D2D2D" text-anchor="start" font-weight="bold">C</text>
<text x="730" y="160" font-size="19" fill="#2D2D2D" text-anchor="start" font-weight="bold">Pull-down network</text>
<text x="730" y="190" font-size="16" fill="#4A4A4A" text-anchor="start">A in series with B, that pair in parallel with C.</text>
<text x="730" y="214" font-size="16" fill="#4A4A4A" text-anchor="start">It conducts, and pulls Y low, for (A AND B) OR C.</text>
<text x="730" y="270" font-size="19" fill="#2D2D2D" text-anchor="start" font-weight="bold">Pull-up network</text>
<text x="730" y="300" font-size="16" fill="#4A4A4A" text-anchor="start">The series-parallel dual: A in parallel with B,</text>
<text x="730" y="324" font-size="16" fill="#4A4A4A" text-anchor="start">that pair in series with C.</text>
<text x="730" y="380" font-size="19" fill="#2D2D2D" text-anchor="start" font-weight="bold">Cost</text>
<text x="730" y="410" font-size="16" fill="#4A4A4A" text-anchor="start">6 transistors, one stage of delay.</text>
<text x="730" y="440" font-size="16" fill="#4A4A4A" text-anchor="start">The same function from separate cells is an AND2</text>
<text x="730" y="464" font-size="16" fill="#4A4A4A" text-anchor="start">feeding a NOR2: 10 transistors, three stages.</text>
<text x="730" y="520" font-size="19" fill="#E07820" text-anchor="start" font-weight="bold">Why the library carries a family of them</text>
<text x="730" y="550" font-size="16" fill="#E07820" text-anchor="start">AOI21, AOI22, OAI21 and friends exist because the</text>
<text x="730" y="574" font-size="16" fill="#E07820" text-anchor="start">recipe never said the network had to be two</text>
<text x="730" y="598" font-size="16" fill="#E07820" text-anchor="start">transistors. Technology mapping during synthesis</text>
<text x="730" y="622" font-size="16" fill="#E07820" text-anchor="start">is largely the business of spotting where one fits.</text>
<text x="730" y="690" font-size="15" fill="#4A4A4A" text-anchor="start">Note the C transistors are drawn with their gates</text>
<text x="730" y="712" font-size="15" fill="#4A4A4A" text-anchor="start">facing right. Only the drawing is mirrored, the</text>
<text x="730" y="734" font-size="15" fill="#4A4A4A" text-anchor="start">circuit is the same.</text>
</svg>