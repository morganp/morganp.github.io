<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1200" height="830" fill="#F5F2EC"/>
<text x="50" y="46" font-size="26" font-weight="bold" fill="#2D2D2D">NAND2 and NOR2: the same four transistors, arranged as duals</text>
<text x="50" y="74" font-size="17" fill="#4A4A4A">Series in the pull-down network becomes parallel in the pull-up network, and the other way round.</text>
<rect x="40" y="105" width="550" height="655" rx="14" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>
<text x="315" y="145" font-size="22" fill="#2D2D2D" text-anchor="middle" font-weight="bold">NAND2</text>
