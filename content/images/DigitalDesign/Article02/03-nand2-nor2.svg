<text x="70" y="650" font-size="16" fill="#4A4A4A" text-anchor="start">Pull-up: two pMOS in <tspan font-weight="bold">parallel</tspan>. Either input low pulls Y high.</text>
<text x="70" y="676" font-size="16" fill="#4A4A4A" text-anchor="start">Pull-down: two nMOS in <tspan font-weight="bold">series</tspan>. Both inputs high to pull Y low.</text>
<text x="70" y="704" font-size="15" fill="#E07820" text-anchor="start">The series stack is the fast nMOS pair. About 2W each and the</text>
<text x="70" y="726" font-size="15" fill="#E07820" text-anchor="start">cell balances.</text>
<rect x="610" y="105" width="550" height="655" rx="14" fill="none" stroke="#4A4A4A" stroke-width="1.5"/>
<text x="885" y="145" font-size="22" fill="#2D2D2D" text-anchor="middle" font-weight="bold">NOR2</text>
<path d="M 930 170 L 1010 170" stroke="#2D2D2D" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="970" y="156" font-size="16" fill="#2D2D2D" text-anchor="middle">VDD</text>
