<text x="810" y="346" font-size="19" fill="#2D2D2D" text-anchor="end" font-weight="bold">B</text>
<text x="640" y="650" font-size="16" fill="#4A4A4A" text-anchor="start">Pull-up: two pMOS in <tspan font-weight="bold">series</tspan>. Both inputs low to pull Y high.</text>
<text x="640" y="676" font-size="16" fill="#4A4A4A" text-anchor="start">Pull-down: two nMOS in <tspan font-weight="bold">parallel</tspan>. Either input high pulls Y low.</text>
<text x="640" y="704" font-size="15" fill="#E07820" text-anchor="start">The series stack is the slow pMOS pair. About 4W each, so NOR2</text>
<text x="640" y="726" font-size="15" fill="#E07820" text-anchor="start">is the larger and slower cell.</text>
<text x="40" y="805" font-size="17" fill="#7B35C2" text-anchor="start">Four transistors each, two per input. The difference is which network got the series stack, and that is the whole reason libraries prefer NAND.</text>
</svg>