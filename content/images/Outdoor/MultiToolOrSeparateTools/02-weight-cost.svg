<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#F5F2EC"/>

  <text x="600" y="50" text-anchor="middle" font-size="29" fill="#2D2D2D">Two kits against a Leatherman Wave+</text>
  <text x="600" y="79" text-anchor="middle" font-size="17" fill="#4A4A4A">Published weights and UK street prices</text>

  <!-- ================= WEIGHT PANEL ================= -->
  <text x="120" y="128" font-size="20" fill="#2D2D2D">Weight</text>

  <g stroke="#D8D2C6" stroke-width="1">
    <line x1="120" y1="500" x2="560" y2="500"/>
    <line x1="120" y1="422" x2="560" y2="422"/>
    <line x1="120" y1="344" x2="560" y2="344"/>
    <line x1="120" y1="266" x2="560" y2="266"/>
    <line x1="120" y1="188" x2="560" y2="188"/>
    <line x1="120" y1="110" x2="560" y2="110"/>
  </g>
  <g font-size="14" fill="#4A4A4A" text-anchor="end">
    <text x="112" y="505">0</text>
    <text x="112" y="427">50</text>
    <text x="112" y="349">100</text>
    <text x="112" y="271">150</text>
    <text x="112" y="193">200</text>
    <text x="112" y="115">250 g</text>
  </g>

  <!-- kit A: Cobra 62, Opinel 45, PB Swiss 89 -->
  <rect x="146" y="403.3" width="100" height="96.7" fill="#7B35C2"/>
  <rect x="146" y="333.1" width="100" height="70.2" fill="#E07820"/>
  <rect x="146" y="194.3" width="100" height="138.8" fill="#4A4A4A"/>
  <g font-size="13" fill="#F5F2EC" text-anchor="middle">
    <text x="196" y="456">Cobra 62</text>
    <text x="196" y="373">Opinel 45</text>
    <text x="196" y="269">PB Swiss 89</text>
  </g>
  <rect x="146" y="194.3" width="100" height="305.7" fill="none" stroke="#2D2D2D" stroke-width="2"/>
  <text x="196" y="185" text-anchor="middle" font-size="19" fill="#2D2D2D">196 g</text>
  <text x="196" y="524" text-anchor="middle" font-size="15" fill="#2D2D2D">PB Swiss kit</text>

  <!-- kit B: Cobra 62, Opinel 45, SabreCut 99 -->
  <rect x="286" y="403.3" width="100" height="96.7" fill="#7B35C2"/>
  <rect x="286" y="333.1" width="100" height="70.2" fill="#E07820"/>
  <rect x="286" y="178.7" width="100" height="154.4" fill="#4A4A4A"/>
  <g font-size="13" fill="#F5F2EC" text-anchor="middle">
    <text x="336" y="456">Cobra 62</text>
    <text x="336" y="373">Opinel 45</text>
    <text x="336" y="261">SabreCut 99</text>
  </g>
  <rect x="286" y="178.7" width="100" height="321.3" fill="none" stroke="#2D2D2D" stroke-width="2"/>
  <text x="336" y="169" text-anchor="middle" font-size="19" fill="#2D2D2D">206 g</text>
  <text x="336" y="524" text-anchor="middle" font-size="15" fill="#2D2D2D">SabreCut kit</text>

  <!-- wave+ -->
  <rect x="426" y="124.2" width="100" height="375.8" fill="#2D2D2D"/>
  <text x="476" y="114" text-anchor="middle" font-size="19" fill="#2D2D2D">241 g</text>
  <text x="476" y="524" text-anchor="middle" font-size="15" fill="#2D2D2D">Wave+</text>

  <line x1="120" y1="500" x2="560" y2="500" stroke="#2D2D2D" stroke-width="2"/>

  <!-- ================= PRICE PANEL ================= -->
  <text x="660" y="128" font-size="20" fill="#2D2D2D">Price</text>

  <g stroke="#D8D2C6" stroke-width="1">
    <line x1="660" y1="500" x2="1100" y2="500"/>
    <line x1="660" y1="422" x2="1100" y2="422"/>
    <line x1="660" y1="344" x2="1100" y2="344"/>
    <line x1="660" y1="266" x2="1100" y2="266"/>
    <line x1="660" y1="188" x2="1100" y2="188"/>
    <line x1="660" y1="110" x2="1100" y2="110"/>
  </g>
  <g font-size="14" fill="#4A4A4A" text-anchor="end">
    <text x="652" y="505">0</text>
    <text x="652" y="427">20</text>
    <text x="652" y="349">40</text>
    <text x="652" y="271">60</text>
    <text x="652" y="193">80</text>
    <text x="652" y="115">100 GBP</text>
  </g>

  <!-- kit A: 25, 12, 56 -->
  <rect x="686" y="402.5" width="100" height="97.5" fill="#7B35C2"/>
  <rect x="686" y="355.7" width="100" height="46.8" fill="#E07820"/>
  <rect x="686" y="137.3" width="100" height="218.4" fill="#4A4A4A"/>
  <g font-size="13" fill="#F5F2EC" text-anchor="middle">
    <text x="736" y="456">Cobra 25</text>
    <text x="736" y="384">Opinel 12</text>
    <text x="736" y="252">PB Swiss 56</text>
  </g>
  <rect x="686" y="137.3" width="100" height="362.7" fill="none" stroke="#2D2D2D" stroke-width="2"/>
  <text x="736" y="128" text-anchor="middle" font-size="19" fill="#2D2D2D">93</text>
  <text x="736" y="524" text-anchor="middle" font-size="15" fill="#2D2D2D">PB Swiss kit</text>

  <!-- kit B: 25, 12, 16 -->
  <rect x="826" y="402.5" width="100" height="97.5" fill="#7B35C2"/>
  <rect x="826" y="355.7" width="100" height="46.8" fill="#E07820"/>
  <rect x="826" y="293.3" width="100" height="62.4" fill="#4A4A4A"/>
  <g font-size="13" fill="#F5F2EC" text-anchor="middle">
    <text x="876" y="456">Cobra 25</text>
    <text x="876" y="384">Opinel 12</text>
    <text x="876" y="329">SabreCut 16</text>
  </g>
  <rect x="826" y="293.3" width="100" height="206.7" fill="none" stroke="#2D2D2D" stroke-width="2"/>
  <text x="876" y="284" text-anchor="middle" font-size="19" fill="#2D2D2D">53</text>
  <text x="876" y="524" text-anchor="middle" font-size="15" fill="#2D2D2D">SabreCut kit</text>

  <!-- wave+ -->
  <rect x="966" y="117.8" width="100" height="382.2" fill="#2D2D2D"/>
  <text x="1016" y="108" text-anchor="middle" font-size="19" fill="#2D2D2D">98</text>
  <text x="1016" y="524" text-anchor="middle" font-size="15" fill="#2D2D2D">Wave+</text>

  <line x1="660" y1="500" x2="1100" y2="500" stroke="#2D2D2D" stroke-width="2"/>

  <text x="600" y="588" text-anchor="middle" font-size="17" fill="#4A4A4A">Both kits weigh less than the Wave+. The SabreCut kit costs GBP 45 less.</text>
</svg>
