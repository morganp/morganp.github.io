<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1830" width="1200" height="1830" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07820"/></marker></defs>
<rect width="1200" height="1830" fill="#F5F2EC"/>
<text x="40" y="48" font-size="31" font-weight="600" fill="#2D2D2D">The clove hitch</text>
<text x="40" y="78" font-size="17" fill="#4A4A4A">Two turns round the pole, the second crossing the first, with the end tucked under the crossing.</text>
<g transform="translate(0,112)"><text x="40" y="26" font-size="21" font-weight="600" fill="#7B35C2">1</text>
<text x="66" y="26" font-size="21" fill="#2D2D2D">Wrap the end round the pole</text>
<rect x="24" y="228" width="536" height="64" rx="8" fill="#7B35C2" stroke="#2D2D2D" stroke-width="3"/><ellipse cx="560" cy="260" rx="14" ry="32" fill="#7B35C2" stroke="#2D2D2D" stroke-width="3"/><rect x="34" y="240" width="516" height="12" rx="6" fill="#F5F2EC" opacity="0.20"/><path d="M282,228 C270,244 258,270 252,292" fill="none" stroke="#F5F2EC" stroke-width="3.5" stroke-dasharray="8 7" opacity="0.75" stroke-linecap="round"/><path d="M302,470 C297,428 289,378 292,338 C293,318 292,304 291,294" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M302,470 C297,428 289,378 292,338 C293,318 292,304 291,294" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M291,294 C290,274 288,254 288,240 C288,234 286,230 282,228" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M291,294 C290,274 288,254 288,240 C288,234 286,230 282,228" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M206,214 C232,222 254,224 268,226" fill="none" stroke="#E07820" stroke-width="3.2" marker-end="url(#a)"/><text x="198" y="208" font-size="16" fill="#E07820" text-anchor="end">it carries on behind</text>
<text x="40" y="510" font-size="17" fill="#4A4A4A" font-weight="normal">The standing part hangs below. The end goes up the</text>
<text x="40" y="533" font-size="17" fill="#4A4A4A" font-weight="normal">front and over the top, out of sight behind.</text></g><g transform="translate(600,112)"><text x="40" y="26" font-size="21" font-weight="600" fill="#7B35C2">2</text>
<text x="66" y="26" font-size="21" fill="#2D2D2D">Bring it out underneath</text>
<rect x="24" y="228" width="536" height="64" rx="8" fill="#7B35C2" stroke="#2D2D2D" stroke-width="3"/><ellipse cx="560" cy="260" rx="14" ry="32" fill="#7B35C2" stroke="#2D2D2D" stroke-width="3"/><rect x="34" y="240" width="516" height="12" rx="6" fill="#F5F2EC" opacity="0.20"/><path d="M282,228 C270,244 258,270 252,292" fill="none" stroke="#F5F2EC" stroke-width="3.5" stroke-dasharray="8 7" opacity="0.75" stroke-linecap="round"/><path d="M302,470 C297,428 289,378 292,338 C293,318 292,304 291,294" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M302,470 C297,428 289,378 292,338 C293,318 292,304 291,294" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M291,294 C290,274 288,254 288,240 C288,234 286,230 282,228" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M291,294 C290,274 288,254 288,240 C288,234 286,230 282,228" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M252,292 C247,332 245,382 251,440" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M252,292 C247,332 245,382 251,440" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M196,368 C214,372 228,374 238,376" fill="none" stroke="#E07820" stroke-width="3.2" marker-end="url(#a)"/><text x="188" y="364" font-size="16" fill="#E07820" text-anchor="end">out here</text>
<text x="40" y="510" font-size="17" fill="#4A4A4A" font-weight="normal">It comes back down the far side and reappears below,</text>
<text x="40" y="533" font-size="17" fill="#4A4A4A" font-weight="normal">just left of the first turn.</text></g><g transform="translate(0,682)"><text x="40" y="26" font-size="21" font-weight="600" fill="#7B35C2">3</text>
<text x="66" y="26" font-size="21" fill="#2D2D2D">Cross over and round again</text>
<rect x="24" y="228" width="536" height="64" rx="8" fill="#7B35C2" stroke="#2D2D2D" stroke-width="3"/><ellipse cx="560" cy="260" rx="14" ry="32" fill="#7B35C2" stroke="#2D2D2D" stroke-width="3"/><rect x="34" y="240" width="516" height="12" rx="6" fill="#F5F2EC" opacity="0.20"/><path d="M282,228 C270,244 258,270 252,292" fill="none" stroke="#F5F2EC" stroke-width="3.5" stroke-dasharray="8 7" opacity="0.75" stroke-linecap="round"/><path d="M302,470 C297,428 289,378 292,338 C293,318 292,304 291,294" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M302,470 C297,428 289,378 292,338 C293,318 292,304 291,294" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M291,294 C290,274 288,254 288,240 C288,234 286,230 282,228" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M291,294 C290,274 288,254 288,240 C288,234 286,230 282,228" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M337,228 C344,246 348,272 350,292" fill="none" stroke="#F5F2EC" stroke-width="3.5" stroke-dasharray="8 7" opacity="0.75" stroke-linecap="round"/><path d="M252,292 C273,283 301,259 322,241 C328,236 333,232 337,228" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M252,292 C273,283 301,259 322,241 C328,236 333,232 337,228" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M420,186 C400,200 382,210 362,218" fill="none" stroke="#E07820" stroke-width="3.2" marker-end="url(#a)"/><text x="428" y="180" font-size="16" fill="#E07820" text-anchor="start">second turn</text>
<text x="40" y="510" font-size="17" fill="#4A4A4A" font-weight="normal">The second turn lies diagonally across the first.</text>
<text x="40" y="533" font-size="17" fill="#4A4A4A" font-weight="normal">That crossing is the X the knot is known by.</text></g><g transform="translate(600,682)"><text x="40" y="26" font-size="21" font-weight="600" fill="#7B35C2">4</text>
<text x="66" y="26" font-size="21" fill="#2D2D2D">Feed the end under the crossing</text>
<rect x="24" y="228" width="536" height="64" rx="8" fill="#7B35C2" stroke="#2D2D2D" stroke-width="3"/><ellipse cx="560" cy="260" rx="14" ry="32" fill="#7B35C2" stroke="#2D2D2D" stroke-width="3"/><rect x="34" y="240" width="516" height="12" rx="6" fill="#F5F2EC" opacity="0.20"/><path d="M282,228 C270,244 258,270 252,292" fill="none" stroke="#F5F2EC" stroke-width="3.5" stroke-dasharray="8 7" opacity="0.75" stroke-linecap="round"/><path d="M352,296 C347,289 342,282 337,274" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M352,296 C347,289 342,282 337,274" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M302,470 C297,428 289,378 292,338 C293,318 292,304 291,294" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M302,470 C297,428 289,378 292,338 C293,318 292,304 291,294" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M291,294 C290,274 288,254 288,240 C288,234 286,230 282,228" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M291,294 C290,274 288,254 288,240 C288,234 286,230 282,228" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M337,228 C344,246 348,272 350,292" fill="none" stroke="#F5F2EC" stroke-width="3.5" stroke-dasharray="8 7" opacity="0.75" stroke-linecap="round"/><path d="M252,292 C273,283 301,259 322,241 C328,236 333,232 337,228" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M252,292 C273,283 301,259 322,241 C328,236 333,232 337,228" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M424,318 C404,312 384,304 366,296" fill="none" stroke="#E07820" stroke-width="3.2" marker-end="url(#a)"/><text x="432" y="322" font-size="16" fill="#E07820" text-anchor="start">feed it under here</text>
<text x="40" y="510" font-size="17" fill="#E07820" font-weight="600">Under the diagonal it just made. This is the tuck,</text>
<text x="40" y="533" font-size="17" fill="#E07820" font-weight="600">and without it the turns unroll.</text></g><g transform="translate(0,1252)"><text x="40" y="26" font-size="21" font-weight="600" fill="#7B35C2">5</text>
<text x="66" y="26" font-size="21" fill="#2D2D2D">Pull it through and set it</text>
<rect x="24" y="228" width="536" height="64" rx="8" fill="#7B35C2" stroke="#2D2D2D" stroke-width="3"/><ellipse cx="560" cy="260" rx="14" ry="32" fill="#7B35C2" stroke="#2D2D2D" stroke-width="3"/><rect x="34" y="240" width="516" height="12" rx="6" fill="#F5F2EC" opacity="0.20"/><path d="M282,228 C270,244 258,270 252,292" fill="none" stroke="#F5F2EC" stroke-width="3.5" stroke-dasharray="8 7" opacity="0.75" stroke-linecap="round"/><path d="M350,292 C340,278 329,263 319,247 C311,233 305,214 301,196 C298,178 296,162 297,148" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M350,292 C340,278 329,263 319,247 C311,233 305,214 301,196 C298,178 296,162 297,148" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M302,470 C297,428 289,378 292,338 C293,318 292,304 291,294" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M302,470 C297,428 289,378 292,338 C293,318 292,304 291,294" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M291,294 C290,274 288,254 288,240 C288,234 286,230 282,228" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M291,294 C290,274 288,254 288,240 C288,234 286,230 282,228" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M337,228 C344,246 348,272 350,292" fill="none" stroke="#F5F2EC" stroke-width="3.5" stroke-dasharray="8 7" opacity="0.75" stroke-linecap="round"/><path d="M252,292 C273,283 301,259 322,241 C328,236 333,232 337,228" fill="none" stroke="#2D2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M252,292 C273,283 301,259 322,241 C328,236 333,232 337,228" fill="none" stroke="#F5F2EC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M334,140 C320,134 310,134 304,140" fill="none" stroke="#E07820" stroke-width="3.2" marker-end="url(#a)"/><text x="342" y="136" font-size="16" fill="#E07820" text-anchor="start">pull</text><path d="M336,452 C322,458 310,462 304,462" fill="none" stroke="#E07820" stroke-width="3.2" marker-end="url(#a)"/><text x="344" y="452" font-size="16" fill="#E07820" text-anchor="start">pull</text>
<text x="40" y="510" font-size="17" fill="#4A4A4A" font-weight="normal">The end leaves above the pole and the standing part</text>
<text x="40" y="533" font-size="17" fill="#E07820" font-weight="600">below. Opposite sides: that is a clove hitch.</text></g>
</svg>