<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 810" width="1280" height="810">
  <style>
    .bg    { fill: #F5F2EC; }
    .wood  { fill: #F5F2EC; stroke: #2D2D2D; stroke-width: 3.5; stroke-linejoin: round; }
    .ghost { fill: none; stroke: #4A4A4A; stroke-width: 1.6; stroke-dasharray: 9 6; }
    .hid   { fill: none; stroke: #2D2D2D; stroke-width: 2; stroke-dasharray: 8 5; }
    .blade { fill: none; stroke: #2D2D2D; stroke-width: 3; }
    .pin   { fill: #E07820; stroke: #2D2D2D; stroke-width: 2; }
    .arc   { fill: none; stroke: #E07820; stroke-width: 2.6; stroke-dasharray: 12 7; }
    .head  { fill: #E07820; }
    .dim   { fill: none; stroke: #4A4A4A; stroke-width: 1.6; }
    .ext   { fill: none; stroke: #4A4A4A; stroke-width: 1; stroke-dasharray: 4 4; }
    text   { font-family: Helvetica, Arial, sans-serif; fill: #2D2D2D; }
    .lbl   { font-size: 21px; }
    .dtx   { font-size: 20px; fill: #4A4A4A; }
    .key   { font-size: 21px; fill: #7B35C2; }
    .key2  { font-size: 21px; fill: #E07820; }
    .ttl   { font-size: 25px; font-weight: bold; }
  </style>

  <rect class="bg" x="0" y="0" width="1280" height="810"/>
  <text class="ttl" x="40" y="46">Folded, blade sheathed in its own arms</text>
  <text class="dtx" x="40" y="76">Stretcher and toggle removed. Each arm swings 90 degrees about its blade pin.</text>

  <!-- ghost of the assembled left arm -->
  <rect class="ghost" x="74" y="148" width="72" height="504" rx="5"/>
  <text class="dtx" x="150" y="200">assembled</text>
  <text class="dtx" x="150" y="224">position</text>

  <!-- fold arc -->
  <path class="arc" d="M 110 148 A 472 472 0 0 1 582 620"/>
  <polygon class="head" points="582,634 573,610 591,610"/>
  <text class="key2" x="330" y="326">90&#176;</text>

  <!-- folded arms -->
  <rect class="wood" x="78"  y="584" width="504" height="72" rx="5"/>
  <rect class="wood" x="593" y="584" width="504" height="72" rx="5"/>

  <!-- blade, hidden inside the arms -->
  <line class="hid" x1="110" y1="600" x2="1065" y2="600"/>
  <line class="hid" x1="110" y1="640" x2="1065" y2="640"/>
  <line class="hid" x1="110" y1="600" x2="110"  y2="640"/>
  <line class="hid" x1="1065" y1="600" x2="1065" y2="640"/>

  <!-- exposed blade in the mid gap -->
  <rect class="blade" x="582" y="600" width="11" height="40"/>

  <!-- captive pins -->
  <circle class="pin" cx="110"  cy="620" r="9"/>
  <circle class="pin" cx="1065" cy="620" r="9"/>

  <!-- overall folded length -->
  <line class="ext" x1="78"   y1="660" x2="78"   y2="736"/>
  <line class="ext" x1="1097" y1="660" x2="1097" y2="736"/>
  <line class="dim" x1="78"   y1="724" x2="1097" y2="724"/>
  <line class="dim" x1="78"   y1="716" x2="78"   y2="732"/>
  <line class="dim" x1="1097" y1="716" x2="1097" y2="732"/>
  <rect class="bg" x="480" y="708" width="216" height="28"/>
  <text class="dtx" x="588" y="730" text-anchor="middle">637 folded</text>

  <!-- toe overhang -->
  <line class="ext" x1="110" y1="660" x2="110" y2="700"/>
  <line class="dim" x1="78"  y1="688" x2="110" y2="688"/>
  <line class="dim" x1="78"  y1="680" x2="78"  y2="696"/>
  <line class="dim" x1="110" y1="680" x2="110" y2="696"/>
  <text class="dtx" x="122" y="694">20 toe stub, covers the eyelet</text>

  <!-- mid gap callout -->
  <line class="dim" x1="588" y1="596" x2="588" y2="470"/>
  <text class="key" x="602" y="462">7 mm of teeth left showing at mid span</text>

  <!-- labels -->
  <text class="lbl" x="300" y="566">arm</text>
  <text class="lbl" x="820" y="566">arm</text>
  <text class="key2" x="960" y="512">blade pivots here, never removed</text>
  <line class="dim" x1="1060" y1="524" x2="1066" y2="606"/>
</svg>
