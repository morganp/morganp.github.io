<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620">
  <style>
    .bg   { fill: #F5F2EC; }
    .wood { fill: none; stroke: #2D2D2D; stroke-width: 3.5; stroke-linejoin: round; }
    .kerf { fill: none; stroke: #7B35C2; stroke-width: 2.6; }
    .pin  { fill: #E07820; stroke: #2D2D2D; stroke-width: 2; }
    .dim  { fill: none; stroke: #4A4A4A; stroke-width: 1.6; }
    .ext  { fill: none; stroke: #4A4A4A; stroke-width: 1; stroke-dasharray: 4 4; }
    text  { font-family: Helvetica, Arial, sans-serif; fill: #2D2D2D; }
    .lbl  { font-size: 21px; }
    .dtx  { font-size: 20px; fill: #4A4A4A; }
    .key  { font-size: 20px; fill: #7B35C2; }
    .key2 { font-size: 20px; fill: #E07820; }
    .ttl  { font-size: 25px; font-weight: bold; }
    .sec  { font-size: 21px; font-weight: bold; }
  </style>

  <rect class="bg" x="0" y="0" width="1280" height="620"/>
  <text class="ttl" x="40" y="46">Arm sections, viewed along the arm</text>
  <text class="dtx" x="40" y="76">Inner face to the right in every section. Millimetres.</text>

  <!-- ============ Section A: at the pin ============ -->
  <text class="sec" x="90" y="186">A  at the blade pin</text>
  <rect class="wood" x="90" y="230" width="270" height="150" rx="4"/>
  <line class="kerf" x1="150" y1="301" x2="360" y2="301"/>
  <line class="kerf" x1="150" y1="309" x2="360" y2="309"/>
  <line class="kerf" x1="150" y1="301" x2="150" y2="309"/>
  <rect class="pin" x="213" y="222" width="24" height="166" rx="4"/>
  <text class="key2" x="90" y="452">4 mm pin, driven through</text>
  <text class="key2" x="90" y="476">both cheeks, permanent</text>
  <line class="dim" x1="225" y1="436" x2="225" y2="392"/>

  <!-- height dimension, left of section A -->
  <line class="ext" x1="46" y1="230" x2="86" y2="230"/>
  <line class="ext" x1="46" y1="380" x2="86" y2="380"/>
  <line class="dim" x1="58" y1="230" x2="58" y2="380"/>
  <line class="dim" x1="50" y1="230" x2="66" y2="230"/>
  <line class="dim" x1="50" y1="380" x2="66" y2="380"/>
  <rect class="bg" x="44" y="288" width="28" height="34"/>
  <text class="dtx" x="58" y="312" text-anchor="middle" transform="rotate(-90 58 312)">25</text>

  <!-- ============ Section B: mid arm ============ -->
  <text class="sec" x="505" y="186">B  mid arm</text>
  <rect class="wood" x="505" y="230" width="270" height="150" rx="4"/>
  <line class="kerf" x1="565" y1="301" x2="775" y2="301"/>
  <line class="kerf" x1="565" y1="309" x2="775" y2="309"/>
  <line class="kerf" x1="565" y1="301" x2="565" y2="309"/>

  <!-- overall width dimension under B -->
  <line class="ext" x1="505" y1="384" x2="505" y2="424"/>
  <line class="ext" x1="775" y1="384" x2="775" y2="424"/>
  <line class="dim" x1="505" y1="412" x2="775" y2="412"/>
  <line class="dim" x1="505" y1="404" x2="505" y2="420"/>
  <line class="dim" x1="775" y1="404" x2="775" y2="420"/>
  <rect class="bg" x="622" y="396" width="36" height="28"/>
  <text class="dtx" x="640" y="418" text-anchor="middle">45</text>

  <!-- kerf depth dimension -->
  <line class="dim" x1="565" y1="452" x2="775" y2="452"/>
  <line class="dim" x1="565" y1="444" x2="565" y2="460"/>
  <line class="dim" x1="775" y1="444" x2="775" y2="460"/>
  <text class="key" x="670" y="482" text-anchor="middle">35 kerf depth</text>
  <!-- spine dimension -->
  <line class="dim" x1="505" y1="452" x2="565" y2="452"/>
  <line class="dim" x1="505" y1="444" x2="505" y2="460"/>
  <text class="dtx" x="470" y="458" text-anchor="end">10 spine</text>
  <text class="key" x="505" y="524">kerf 1.5 wide, saw plate width, runs the</text>
  <text class="key" x="505" y="548">full length of the arm</text>

  <!-- ============ Section C: at the stretcher socket ============ -->
  <text class="sec" x="920" y="186">C  at the stretcher socket</text>
  <path class="wood" d="M 920 230 H 1190 V 248 H 1130 V 362 H 1190 V 380 H 920 Z"/>
  <line class="kerf" x1="980" y1="301" x2="1130" y2="301"/>
  <line class="kerf" x1="980" y1="309" x2="1130" y2="309"/>
  <line class="kerf" x1="980" y1="301" x2="980"  y2="309"/>

  <!-- socket dims -->
  <line class="ext" x1="1130" y1="366" x2="1130" y2="424"/>
  <line class="ext" x1="1190" y1="384" x2="1190" y2="424"/>
  <line class="dim" x1="1130" y1="412" x2="1190" y2="412"/>
  <line class="dim" x1="1130" y1="404" x2="1130" y2="420"/>
  <line class="dim" x1="1190" y1="404" x2="1190" y2="420"/>
  <text class="dtx" x="1160" y="398" text-anchor="middle">10</text>
  <line class="ext" x1="1194" y1="248" x2="1244" y2="248"/>
  <line class="ext" x1="1194" y1="362" x2="1244" y2="362"/>
  <line class="dim" x1="1232" y1="248" x2="1232" y2="362"/>
  <line class="dim" x1="1224" y1="248" x2="1240" y2="248"/>
  <line class="dim" x1="1224" y1="362" x2="1240" y2="362"/>
  <rect class="bg" x="1218" y="288" width="28" height="34"/>
  <text class="dtx" x="1232" y="312" text-anchor="middle" transform="rotate(-90 1232 312)">19</text>

  <text class="lbl" x="920" y="446">socket is a pocket, not a mortise. It</text>
  <text class="lbl" x="920" y="470">widens the kerf mouth rather than</text>
  <text class="lbl" x="920" y="494">crossing it, so the two never fight.</text>
  <text class="dtx" x="920" y="530">3 mm of wood left each side holds</text>
  <text class="dtx" x="920" y="554">the stretcher against sideways slip.</text>
</svg>
