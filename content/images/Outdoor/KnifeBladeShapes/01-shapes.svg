<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 960" width="1800" height="960" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1800" height="960" fill="#F5F2EC"/>

  <defs>
    <g id="stub">
      <rect x="-90" y="-8" width="90" height="96" rx="18" fill="#D8D0C0" stroke="#2D2D2D" stroke-width="4"/>
    </g>
  </defs>

  <g stroke-linejoin="round">
    <!-- Row 1 -->
    <!-- Drop point -->
    <g transform="translate(130,230)">
      <path d="M0,0 L100,0 C190,0 250,8 280,22 C250,56 225,80 160,80 L0,80 Z" fill="#E9E4DA" stroke="#2D2D2D" stroke-width="4"/>
      <use href="#stub"/>
      <line x1="0" y1="40" x2="300" y2="40" stroke="#7B35C2" stroke-width="2.5" stroke-dasharray="10 8"/>
      <circle cx="280" cy="22" r="8" fill="#E07820"/>
    </g>
    <!-- Clip point -->
    <g transform="translate(570,230)">
      <path d="M0,0 L180,0 Q235,22 280,32 C265,60 235,80 200,80 L0,80 Z" fill="#E9E4DA" stroke="#2D2D2D" stroke-width="4"/>
      <use href="#stub"/>
      <line x1="0" y1="40" x2="300" y2="40" stroke="#7B35C2" stroke-width="2.5" stroke-dasharray="10 8"/>
      <circle cx="280" cy="32" r="8" fill="#E07820"/>
    </g>
    <!-- Sheepsfoot -->
    <g transform="translate(1010,230)">
      <path d="M0,0 L200,0 C250,0 278,30 280,80 L0,80 Z" fill="#E9E4DA" stroke="#2D2D2D" stroke-width="4"/>
      <use href="#stub"/>
      <line x1="0" y1="40" x2="300" y2="40" stroke="#7B35C2" stroke-width="2.5" stroke-dasharray="10 8"/>
      <circle cx="280" cy="80" r="8" fill="#E07820"/>
    </g>
    <!-- Wharncliffe -->
    <g transform="translate(1450,230)">
      <path d="M0,0 L110,0 C190,12 250,52 280,80 L0,80 Z" fill="#E9E4DA" stroke="#2D2D2D" stroke-width="4"/>
      <use href="#stub"/>
      <line x1="0" y1="40" x2="300" y2="40" stroke="#7B35C2" stroke-width="2.5" stroke-dasharray="10 8"/>
      <circle cx="280" cy="80" r="8" fill="#E07820"/>
    </g>

    <!-- Row 2 -->
    <!-- Straight back -->
    <g transform="translate(130,660)">
      <path d="M0,0 L280,0 C270,50 220,80 150,80 L0,80 Z" fill="#E9E4DA" stroke="#2D2D2D" stroke-width="4"/>
      <use href="#stub"/>
      <line x1="0" y1="40" x2="300" y2="40" stroke="#7B35C2" stroke-width="2.5" stroke-dasharray="10 8"/>
      <circle cx="280" cy="0" r="8" fill="#E07820"/>
    </g>
    <!-- Spear point -->
    <g transform="translate(570,660)">
      <path d="M0,0 L170,0 C220,0 255,20 280,40 C255,62 220,80 170,80 L0,80 Z" fill="#E9E4DA" stroke="#2D2D2D" stroke-width="4"/>
      <path d="M130,9 C200,9 245,22 268,40" fill="none" stroke="#2D2D2D" stroke-width="2.5"/>
      <use href="#stub"/>
      <line x1="0" y1="40" x2="300" y2="40" stroke="#7B35C2" stroke-width="2.5" stroke-dasharray="10 8"/>
      <circle cx="280" cy="40" r="8" fill="#E07820"/>
    </g>
    <!-- Tanto -->
    <g transform="translate(1010,660)">
      <path d="M0,0 L235,0 L280,16 L250,80 L0,80 Z" fill="#E9E4DA" stroke="#2D2D2D" stroke-width="4"/>
      <use href="#stub"/>
      <line x1="0" y1="40" x2="300" y2="40" stroke="#7B35C2" stroke-width="2.5" stroke-dasharray="10 8"/>
      <circle cx="280" cy="16" r="8" fill="#E07820"/>
    </g>
    <!-- Hawkbill -->
    <g transform="translate(1450,660)">
      <path d="M0,0 L110,0 C210,0 270,40 280,110 C240,86 170,76 110,80 L0,80 Z" fill="#E9E4DA" stroke="#2D2D2D" stroke-width="4"/>
      <use href="#stub"/>
      <line x1="0" y1="40" x2="300" y2="40" stroke="#7B35C2" stroke-width="2.5" stroke-dasharray="10 8"/>
      <circle cx="280" cy="110" r="8" fill="#E07820"/>
    </g>
  </g>

  <!-- names -->
  <g font-size="34" font-weight="700" fill="#2D2D2D" text-anchor="middle">
    <text x="260" y="400">Drop point</text>
    <text x="700" y="400">Clip point</text>
    <text x="1140" y="400">Sheepsfoot</text>
    <text x="1580" y="400">Wharncliffe</text>
    <text x="260" y="830">Straight back</text>
    <text x="700" y="830">Spear point</text>
    <text x="1140" y="830">Tanto</text>
    <text x="1580" y="830">Hawkbill</text>
  </g>
  <g font-size="24" fill="#4A4A4A" text-anchor="middle">
    <text x="260" y="438">Strong tip, all-rounder</text>
    <text x="700" y="438">Fine tip, detail work</text>
    <text x="1140" y="438">No point, safe</text>
    <text x="1580" y="438">Long slope, control</text>
    <text x="260" y="868">Strong spine, simple</text>
    <text x="700" y="868">Symmetrical, double edged</text>
    <text x="1140" y="868">Reinforced tip</text>
    <text x="1580" y="868">Curved, pulls</text>
  </g>
</svg>
