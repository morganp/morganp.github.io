<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#F5F2EC"/>

  <defs>
    <pattern id="steel" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#4A4A4A" stroke-width="1.6" stroke-opacity="0.55"/>
    </pattern>
    <marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#E07820"/>
    </marker>
  </defs>

  <text x="600" y="50" text-anchor="middle" font-size="30" fill="#2D2D2D">Only chromium in solution builds the passive layer</text>
  <text x="600" y="82" text-anchor="middle" font-size="19" fill="#4A4A4A">Cross-section through the blade surface</text>

  <!-- LEFT: chromium in solution, film intact -->
  <g>
    <text x="300" y="136" text-anchor="middle" font-size="23" fill="#2D2D2D">Chromium in solution</text>

    <!-- oxygen and water arriving, turned away -->
    <line x1="150" y1="190" x2="196" y2="238" stroke="#E07820" stroke-width="3.5" marker-end="url(#amber)"/>
    <line x1="300" y1="180" x2="300" y2="236" stroke="#E07820" stroke-width="3.5" marker-end="url(#amber)"/>
    <line x1="450" y1="190" x2="404" y2="238" stroke="#E07820" stroke-width="3.5" marker-end="url(#amber)"/>
    <text x="300" y="172" text-anchor="middle" font-size="18" fill="#E07820">oxygen and water</text>

    <!-- passive film -->
    <rect x="90" y="248" width="420" height="16" fill="#7B35C2" fill-opacity="0.85"/>
    <text x="530" y="262" font-size="17" fill="#7B35C2">chromium oxide film</text>
    <text x="530" y="284" font-size="17" fill="#4A4A4A">a few nanometres thick</text>

    <!-- steel body -->
    <rect x="90" y="264" width="420" height="190" fill="url(#steel)" stroke="#2D2D2D" stroke-width="3"/>
    <g fill="#7B35C2">
      <circle cx="150" cy="310" r="6"/><circle cx="225" cy="345" r="6"/><circle cx="300" cy="300" r="6"/>
      <circle cx="375" cy="350" r="6"/><circle cx="450" cy="312" r="6"/><circle cx="190" cy="405" r="6"/>
      <circle cx="270" cy="420" r="6"/><circle cx="355" cy="400" r="6"/><circle cx="440" cy="418" r="6"/>
    </g>
    <text x="300" y="492" text-anchor="middle" font-size="18" fill="#4A4A4A">dissolved chromium atoms feed the film</text>
    <text x="300" y="520" text-anchor="middle" font-size="18" fill="#4A4A4A">scratch it and it reforms in seconds</text>
  </g>

  <!-- RIGHT: chromium locked in carbides, film broken -->
  <g>
    <text x="900" y="136" text-anchor="middle" font-size="23" fill="#2D2D2D">Chromium locked in carbides</text>

    <line x1="750" y1="190" x2="796" y2="238" stroke="#E07820" stroke-width="3.5" marker-end="url(#amber)"/>
    <line x1="900" y1="180" x2="900" y2="330" stroke="#E07820" stroke-width="3.5" marker-end="url(#amber)"/>
    <line x1="1050" y1="190" x2="1004" y2="238" stroke="#E07820" stroke-width="3.5" marker-end="url(#amber)"/>
    <text x="900" y="172" text-anchor="middle" font-size="18" fill="#E07820">oxygen and water</text>

    <!-- broken film: gap above the carbide -->
    <rect x="690" y="248" width="170" height="16" fill="#7B35C2" fill-opacity="0.85"/>
    <rect x="940" y="248" width="170" height="16" fill="#7B35C2" fill-opacity="0.85"/>
    <text x="900" y="240" text-anchor="middle" font-size="17" fill="#E07820">gap in the film</text>

    <rect x="690" y="264" width="420" height="190" fill="url(#steel)" stroke="#2D2D2D" stroke-width="3"/>
    <!-- coarse chromium carbide under the gap -->
    <ellipse cx="900" cy="345" rx="72" ry="42" fill="#7B35C2" fill-opacity="0.75" stroke="#4A4A4A" stroke-width="2"/>
    <text x="900" y="352" text-anchor="middle" font-size="17" fill="#F5F2EC">chromium carbide</text>
    <!-- depleted zone -->
    <ellipse cx="900" cy="345" rx="104" ry="70" fill="none" stroke="#E07820" stroke-width="2.5" stroke-dasharray="9 7"/>
    <text x="900" y="440" text-anchor="middle" font-size="17" fill="#E07820">chromium-depleted zone</text>
    <g fill="#7B35C2">
      <circle cx="730" cy="300" r="6"/><circle cx="760" cy="410" r="6"/><circle cx="1070" cy="305" r="6"/>
      <circle cx="1045" cy="415" r="6"/>
    </g>

    <text x="900" y="492" text-anchor="middle" font-size="18" fill="#4A4A4A">carbide chromium cannot passivate</text>
    <text x="900" y="520" text-anchor="middle" font-size="18" fill="#4A4A4A">pitting starts at the carbide boundary</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-size="20" fill="#2D2D2D">17 percent chromium on the datasheet is not 17 percent doing the work</text>
  <text x="600" y="632" text-anchor="middle" font-size="18" fill="#4A4A4A">The threshold is roughly 10.5 to 11 percent chromium in solution</text>
</svg>
