<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#F5F2EC"/>

  <text x="600" y="52" text-anchor="middle" font-size="30" fill="#2D2D2D">Same alloy, different carbide size</text>
  <text x="600" y="84" text-anchor="middle" font-size="19" fill="#4A4A4A">Both panels at the same magnification</text>

  <!-- LEFT PANEL: conventional ingot -->
  <g>
    <rect x="70" y="120" width="480" height="330" rx="10" fill="none" stroke="#2D2D2D" stroke-width="3"/>
    <!-- coarse carbides -->
    <g fill="#7B35C2" fill-opacity="0.75" stroke="#4A4A4A" stroke-width="2">
      <ellipse cx="190" cy="205" rx="52" ry="34"/>
      <ellipse cx="370" cy="180" rx="44" ry="30" transform="rotate(18 370 180)"/>
      <ellipse cx="470" cy="300" rx="38" ry="52" transform="rotate(-25 470 300)"/>
      <ellipse cx="250" cy="350" rx="58" ry="32" transform="rotate(12 250 350)"/>
      <ellipse cx="390" cy="400" rx="34" ry="28"/>
      <ellipse cx="140" cy="300" rx="30" ry="40" transform="rotate(-15 140 300)"/>
    </g>
    <!-- edge line with a carbide sitting in the apex -->
    <path d="M 70 470 L 550 470" stroke="#2D2D2D" stroke-width="3" fill="none"/>
    <path d="M 240 470 q 22 -18 44 0" stroke="#E07820" stroke-width="4" fill="none"/>
    <ellipse cx="262" cy="470" rx="26" ry="17" fill="#7B35C2" fill-opacity="0.75" stroke="#4A4A4A" stroke-width="2"/>
    <text x="310" y="512" font-size="18" fill="#E07820">carbide larger than the edge apex</text>

    <text x="310" y="570" text-anchor="middle" font-size="24" fill="#2D2D2D">Conventional ingot stainless</text>
    <text x="310" y="600" text-anchor="middle" font-size="18" fill="#4A4A4A">Coarse chromium carbides, tens of microns</text>
    <text x="310" y="626" text-anchor="middle" font-size="18" fill="#4A4A4A">Chips at the apex, resists the stone</text>
  </g>

  <!-- RIGHT PANEL: powder metallurgy -->
  <g>
    <rect x="650" y="120" width="480" height="330" rx="10" fill="none" stroke="#2D2D2D" stroke-width="3"/>
    <g fill="#7B35C2" fill-opacity="0.75">
      <circle cx="700" cy="160" r="7"/><circle cx="760" cy="190" r="6"/><circle cx="820" cy="150" r="7"/>
      <circle cx="880" cy="185" r="6"/><circle cx="940" cy="155" r="7"/><circle cx="1000" cy="192" r="6"/>
      <circle cx="1070" cy="162" r="7"/><circle cx="720" cy="245" r="6"/><circle cx="790" cy="230" r="7"/>
      <circle cx="850" cy="262" r="6"/><circle cx="915" cy="235" r="7"/><circle cx="975" cy="258" r="6"/>
      <circle cx="1045" cy="232" r="7"/><circle cx="690" cy="310" r="7"/><circle cx="755" cy="330" r="6"/>
      <circle cx="825" cy="305" r="7"/><circle cx="890" cy="335" r="6"/><circle cx="955" cy="308" r="7"/>
      <circle cx="1020" cy="330" r="6"/><circle cx="1085" cy="300" r="7"/><circle cx="715" cy="390" r="6"/>
      <circle cx="780" cy="412" r="7"/><circle cx="845" cy="385" r="6"/><circle cx="910" cy="415" r="7"/>
      <circle cx="975" cy="388" r="6"/><circle cx="1040" cy="410" r="7"/><circle cx="1100" cy="385" r="6"/>
      <circle cx="660" cy="212" r="6"/><circle cx="1105" cy="245" r="6"/><circle cx="668" cy="360" r="6"/>
    </g>
    <!-- clean edge -->
    <path d="M 650 470 L 1130 470" stroke="#2D2D2D" stroke-width="3" fill="none"/>
    <path d="M 820 470 q 22 -6 44 0" stroke="#E07820" stroke-width="4" fill="none"/>
    <text x="890" y="512" font-size="18" fill="#E07820">carbides smaller than the apex</text>

    <text x="890" y="570" text-anchor="middle" font-size="24" fill="#2D2D2D">Powder metallurgy stainless</text>
    <text x="890" y="600" text-anchor="middle" font-size="18" fill="#4A4A4A">Fine vanadium and niobium carbides</text>
    <text x="890" y="626" text-anchor="middle" font-size="18" fill="#4A4A4A">Takes a finer edge, sharpens more easily</text>
  </g>
</svg>
