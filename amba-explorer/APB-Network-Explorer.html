document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:oklch(0.145 0.012 258);color:oklch(0.93 0.005 258);font-family:'IBM Plex Sans',system-ui,sans-serif\">\n\n  <div style=\"display:flex;align-items:center;gap:28px;padding:16px 34px;border-bottom:1px solid oklch(0.27 0.011 258);position:sticky;top:0;z-index:30;background:oklch(0.13 0.011 258);backdrop-filter:blur(6px)\">\n    <div style=\"min-width:250px\">\n      <div style=\"font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.22em;color:oklch(0.52 0.01 258)\">APB<\u002Fdiv>\n      <div style=\"font-size:23px;font-weight:700;letter-spacing:-.01em;margin-top:5px\">Network Explorer<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n      <sc-for list=\"{{ crumbs }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"padding:7px 13px;border-radius:6px;border:1px solid {{ c.stroke }};background:{{ c.bg }};font:500 12px/1 'JetBrains Mono',monospace;color:{{ c.fg }}\">{{ c.label }}<\u002Fdiv>\n          <div style=\"font:400 12px/1 'JetBrains Mono',monospace;color:oklch(0.42 0.01 258)\">{{ c.arrow }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;padding-left:26px;border-left:1px solid oklch(0.27 0.011 258);text-align:right\">\n      <div style=\"font:500 12px/1.3 'JetBrains Mono',monospace;color:oklch(0.80 0.15 155)\">{{ levelId }} · {{ rev }}<\u002Fdiv>\n      <div style=\"font:400 12px/1.4 'JetBrains Mono',monospace;color:oklch(0.58 0.01 258);margin-top:3px\">{{ decodeSummary }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:flex-start\">\n\n    <div style=\"width:252px;flex:none;padding:30px 24px 60px;border-right:1px solid oklch(0.27 0.011 258);position:sticky;top:78px\">\n      <div style=\"font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:oklch(0.48 0.01 258);margin-bottom:14px\">EXPLORE<\u002Fdiv>\n      <sc-for list=\"{{ views }}\" as=\"v\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ v.pick }}\" style=\"display:flex;align-items:center;gap:11px;padding:11px 13px;margin-bottom:4px;border-radius:7px;background:{{ v.bg }};border-left:2px solid {{ v.bar }};cursor:pointer\">\n          <div style=\"width:7px;height:7px;border-radius:2px;background:{{ v.dot }};flex:none\"><\u002Fdiv>\n          <div style=\"font:500 13px/1 'JetBrains Mono',monospace;color:{{ v.fg }}\">{{ v.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"height:1px;background:oklch(0.24 0.011 258);margin:26px 0 18px\"><\u002Fdiv>\n      <div style=\"font:400 12px/1.7 'JetBrains Mono',monospace;color:oklch(0.52 0.01 258)\">Blocks follow AMBA APB and the CMSDK / NIC-400 APB subsystem. Signal names follow the AMBA APB specification.<\u002Fdiv>\n      <div style=\"height:1px;background:oklch(0.24 0.011 258);margin:22px 0 18px\"><\u002Fdiv>\n      <div style=\"font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:oklch(0.48 0.01 258);margin-bottom:12px\">CLOCK<\u002Fdiv>\n      <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n        <div sc-camel-on-click=\"{{ step }}\" style=\"padding:9px 14px;border-radius:6px;border:1px solid color-mix(in oklch, oklch(0.74 0.14 245) 34%, transparent);background:color-mix(in oklch, oklch(0.74 0.14 245) 14%, oklch(0.19 0.012 258));font:500 12px/1 'JetBrains Mono',monospace;color:oklch(0.80 0.12 245);cursor:pointer\">1 CLK<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ toggleRun }}\" style=\"padding:9px 14px;border-radius:6px;border:1px solid {{ runStroke }};background:{{ runBg }};font:500 12px/1 'JetBrains Mono',monospace;color:{{ runFg }};cursor:pointer\">{{ runLabel }}<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ reset }}\" style=\"padding:9px 14px;border-radius:6px;border:1px solid oklch(0.26 0.011 258);background:oklch(0.165 0.012 258);font:500 12px/1 'JetBrains Mono',monospace;color:oklch(0.58 0.01 258);cursor:pointer\">RESET<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;font:400 12px/1.6 'JetBrains Mono',monospace;color:oklch(0.52 0.01 258)\">T{{ cycle }} · {{ phase }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-width:0;padding:32px 38px 90px;max-width:1180px\">\n\n      <sc-if value=\"{{ isNetwork }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.22em;color:oklch(0.80 0.15 155)\">NETWORK<\u002Fdiv>\n          <div style=\"font-size:40px;font-weight:700;letter-spacing:-.022em;margin:16px 0 20px;text-wrap:pretty\">{{ levelTitle }}<\u002Fdiv>\n          <div style=\"font-size:17px;line-height:1.65;color:oklch(0.72 0.008 258);max-width:76ch;text-wrap:pretty\">{{ levelProse }}<\u002Fdiv>\n          <div style=\"font-size:17px;line-height:1.65;color:oklch(0.72 0.008 258);max-width:76ch;margin-top:16px;text-wrap:pretty\">Every component is clickable — <strong style=\"color:oklch(0.93 0.005 258)\">press a block<\u002Fstrong> to point the transfer at it, then set the address and data below and press <strong style=\"color:oklch(0.93 0.005 258)\">1 CLK<\u002Fstrong> to advance the model. Each signal is its own wire on its own port: the <span style=\"color:oklch(0.72 0.15 300);font-weight:700\">four purple rails across the top<\u002Fspan> are PADDR, PWRITE, PWDATA and PENABLE, each broadcast from its own requester output and tapped by every completer; a <span style=\"color:oklch(0.74 0.14 245);font-weight:700\">blue PSEL line<\u002Fspan> selects exactly one of them; and the return group carries PRDATA, PREADY and PSLVERR back — <span style=\"color:oklch(0.80 0.15 155);font-weight:700\">green<\u002Fspan> read data, <span style=\"color:oklch(0.85 0.15 90);font-weight:700\">amber<\u002Fspan> a completer stalling with PREADY low, <span style=\"color:oklch(0.72 0.17 25);font-weight:700\">red<\u002Fspan> an error response. A wire only animates while its own signal is driven, so PENABLE stays dark through SETUP and PWDATA stays dark on a read. A block outlined in blue is currently selected by PSEL.<\u002Fdiv>\n\n          <div style=\"font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:oklch(0.48 0.01 258);margin:34px 0 12px\">LEVELS<\u002Fdiv>\n          <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n            <sc-for list=\"{{ levels }}\" as=\"l\" hint-placeholder-count=\"8\">\n              <div sc-camel-on-click=\"{{ l.pick }}\" style=\"padding:11px 15px;border-radius:7px;border:1px solid {{ l.stroke }};background:{{ l.bg }};cursor:pointer;min-width:112px\">\n                <div style=\"font:500 12px/1 'JetBrains Mono',monospace;color:{{ l.idFg }}\">{{ l.id }}<\u002Fdiv>\n                <div style=\"font-size:13px;color:{{ l.fg }};margin-top:6px\">{{ l.name }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:18px;padding:20px 24px;border-left:2px solid oklch(0.80 0.15 155);background:oklch(0.155 0.012 258);border-radius:0 12px 12px 0;display:flex;gap:26px;align-items:flex-start\">\n            <div style=\"font:500 12px/1.5 'JetBrains Mono',monospace;color:oklch(0.80 0.15 155);flex:none;width:150px\">{{ levelId }} · {{ levelName }}<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.6;color:oklch(0.72 0.008 258);text-wrap:pretty\">{{ levelNote }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:34px;overflow-x:auto;overflow-y:hidden;padding:6px 6px 10px;margin-left:-6px\">\n          <div style=\"position:relative;height:{{ canvasH }}px;width:1000px\">\n            <svg width=\"1000\" height=\"{{ canvasH }}\" style=\"position:absolute;left:0;top:0;overflow:visible\">\n              <sc-for list=\"{{ edges }}\" as=\"e\" hint-placeholder-count=\"6\">\n                <path d=\"{{ e.d }}\" fill=\"none\" stroke=\"{{ e.stroke }}\" stroke-width=\"{{ e.w }}\" stroke-dasharray=\"{{ e.dash }}\" style=\"animation:{{ e.anim }}\"><\u002Fpath>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ dots }}\" as=\"k\" hint-placeholder-count=\"4\">\n                <circle cx=\"{{ k.x }}\" cy=\"{{ k.y }}\" r=\"{{ k.r }}\" fill=\"{{ k.fill }}\"><\u002Fcircle>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ pins }}\" as=\"p\" hint-placeholder-count=\"8\">\n                <rect x=\"{{ p.x }}\" y=\"{{ p.y }}\" width=\"{{ p.w }}\" height=\"{{ p.h }}\" rx=\"1\" fill=\"{{ p.fill }}\"><\u002Frect>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <sc-for list=\"{{ edgeLabels }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div style=\"position:absolute;left:{{ t.x }}px;top:{{ t.y }}px;font:400 9px/1 'JetBrains Mono',monospace;color:{{ t.fg }};background:oklch(0.145 0.012 258);padding:2px 4px\">{{ t.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ nodes }}\" as=\"n\" hint-placeholder-count=\"5\">\n              <div sc-camel-on-click=\"{{ n.pick }}\" style=\"position:absolute;left:{{ n.x }}px;top:{{ n.y }}px;width:176px;height:{{ n.h }}px;box-sizing:border-box;padding:0 12px;border-radius:10px;background:oklch(0.175 0.012 258);border:1px solid {{ n.stroke }};box-shadow:{{ n.glow }};cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:4px\">\n                <div style=\"font:500 13px/1.1 'JetBrains Mono',monospace;letter-spacing:.03em;color:{{ n.fg }}\">{{ n.label }}<\u002Fdiv>\n                <div style=\"font:400 10px/1.2 'JetBrains Mono',monospace;color:oklch(0.55 0.01 258)\">{{ n.sub }}<\u002Fdiv>\n                <div style=\"font:400 10px/1.2 'JetBrains Mono',monospace;color:{{ n.rangeFg }}\">{{ n.range }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ packet }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;left:{{ packetX }}px;top:{{ packetY }}px;padding:5px 9px;border-radius:5px;background:{{ packetBg }};border:1px solid {{ packetStroke }};font:500 11px/1 'JetBrains Mono',monospace;color:{{ packetFg }};white-space:nowrap\">{{ packet }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ detail }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;gap:26px;margin-top:14px;font:400 11px/1.7 'JetBrains Mono',monospace;color:oklch(0.52 0.01 258);max-width:900px;text-wrap:pretty\">\n              <div>Every signal is its own wire here. PADDR, PWRITE, PWDATA and PENABLE leave separate requester ports onto four broadcast rails, tapped by every completer. PSEL is private per completer. So is the response: each completer drives its own PRDATA, PREADY and PSLVERR on its own wires — read data is never a shared bus — into its own port group on the mux, which forwards only the selected completer's set upstream. A wire animates only while that signal is really driven, in the direction it travels.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;gap:20px;margin-top:34px;align-items:flex-start;flex-wrap:wrap\">\n            <div style=\"width:392px;flex:none;padding:22px;border:1px solid oklch(0.26 0.011 258);border-radius:12px;background:oklch(0.155 0.012 258)\">\n              <div style=\"font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:oklch(0.48 0.01 258);margin-bottom:18px\">TRANSFER<\u002Fdiv>\n              <div style=\"font:400 11px/1 'JetBrains Mono',monospace;color:oklch(0.58 0.01 258);margin-bottom:7px\">PADDR<\u002Fdiv>\n              <input value=\"{{ addrText }}\" sc-camel-on-change=\"{{ onAddr }}\" spellcheck=\"false\" style=\"width:100%;box-sizing:border-box;padding:11px 13px;border-radius:6px;border:1px solid oklch(0.29 0.011 258);background:oklch(0.19 0.012 258);color:oklch(0.72 0.15 300);font-size:15px;letter-spacing:.05em;outline:none\">\n              <div style=\"display:flex;gap:7px;margin-top:16px\">\n                <sc-for list=\"{{ dirOpts }}\" as=\"d\" hint-placeholder-count=\"2\">\n                  <div sc-camel-on-click=\"{{ d.pick }}\" style=\"flex:1;text-align:center;padding:10px 0;border-radius:6px;border:1px solid {{ d.stroke }};background:{{ d.bg }};font:500 12px/1 'JetBrains Mono',monospace;color:{{ d.fg }};cursor:pointer\">{{ d.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font:400 11px/1 'JetBrains Mono',monospace;color:oklch(0.58 0.01 258);margin:16px 0 7px\">PWDATA<\u002Fdiv>\n              <input value=\"{{ dataText }}\" sc-camel-on-change=\"{{ onData }}\" spellcheck=\"false\" style=\"width:100%;box-sizing:border-box;padding:11px 13px;border-radius:6px;border:1px solid oklch(0.29 0.011 258);background:oklch(0.19 0.012 258);color:{{ dataFg }};font-size:15px;letter-spacing:.05em;outline:none\">\n              <div style=\"font:400 11px/1 'JetBrains Mono',monospace;color:oklch(0.58 0.01 258);margin:18px 0 8px\">PPROT <span style=\"color:oklch(0.48 0.01 258)\">{{ protHint }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:7px\">\n                <sc-for list=\"{{ protBits }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ p.toggle }}\" style=\"flex:1;padding:10px 8px;border-radius:6px;border:1px solid {{ p.stroke }};background:{{ p.bg }};cursor:pointer;opacity:{{ p.op }}\">\n                    <div style=\"font:500 11px/1 'JetBrains Mono',monospace;color:{{ p.fg }}\">{{ p.bit }}<\u002Fdiv>\n                    <div style=\"font:400 10px/1.2 'JetBrains Mono',monospace;color:oklch(0.58 0.01 258);margin-top:5px\">{{ p.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:20px;padding-top:18px;border-top:1px solid oklch(0.26 0.011 258)\">\n                <div style=\"font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:oklch(0.48 0.01 258);margin-bottom:10px\">DECODE<\u002Fdiv>\n                <div style=\"font:400 12px/1.75 'JetBrains Mono',monospace;color:{{ decodeFg }};text-wrap:pretty\">{{ decodeText }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"flex:1;min-width:340px;padding:22px;border:1px solid oklch(0.26 0.011 258);border-radius:12px;background:oklch(0.155 0.012 258)\">\n              <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:6px\">\n                <div style=\"font:500 15px/1 'JetBrains Mono',monospace;color:oklch(0.93 0.005 258)\">{{ selLabel }}<\u002Fdiv>\n                <div style=\"font:400 11px/1 'JetBrains Mono',monospace;color:oklch(0.55 0.01 258)\">{{ selSub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.6;color:oklch(0.66 0.008 258);margin-bottom:18px;text-wrap:pretty\">{{ selNote }}<\u002Fdiv>\n              <sc-if value=\"{{ hasRegs }}\" hint-placeholder-val=\"{{ true }}\">\n                <div>\n                  <div style=\"font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:oklch(0.48 0.01 258);margin-bottom:10px\">REGISTERS · click to target<\u002Fdiv>\n                  <sc-for list=\"{{ regs }}\" as=\"r\" hint-placeholder-count=\"4\">\n                    <div sc-camel-on-click=\"{{ r.pick }}\" style=\"display:flex;align-items:center;gap:14px;padding:9px 11px;border-radius:6px;background:{{ r.bg }};border:1px solid {{ r.stroke }};margin-bottom:5px;cursor:pointer\">\n                      <div style=\"font:400 11px/1 'JetBrains Mono',monospace;color:oklch(0.58 0.01 258);width:96px;flex:none\">{{ r.addr }}<\u002Fdiv>\n                      <div style=\"font:500 12px/1 'JetBrains Mono',monospace;color:oklch(0.72 0.008 258);flex:1\">{{ r.name }}<\u002Fdiv>\n                      <div style=\"font:400 12px/1 'JetBrains Mono',monospace;color:{{ r.valFg }}\">{{ r.val }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ showWave }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:34px\">\n              <div style=\"font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:oklch(0.48 0.01 258);margin-bottom:14px\">WAVEFORM · {{ rev }}<\u002Fdiv>\n              <div style=\"border:1px solid oklch(0.26 0.011 258);border-radius:12px;background:oklch(0.155 0.012 258);padding:18px 0 14px;overflow-x:auto\">\n                <div style=\"display:flex;padding:0 18px 10px\">\n                  <div style=\"width:118px;flex:none\"><\u002Fdiv>\n                  <sc-for list=\"{{ cycleHeads }}\" as=\"h\" hint-placeholder-count=\"8\">\n                    <div style=\"width:64px;flex:none;font:400 10px/1 'JetBrains Mono',monospace;color:{{ h.fg }}\">{{ h.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-for list=\"{{ waveRows }}\" as=\"row\" hint-placeholder-count=\"7\">\n                  <div style=\"display:flex;align-items:center;padding:0 18px;height:34px\">\n                    <div style=\"width:118px;flex:none;font:400 11px/1 'JetBrains Mono',monospace;color:{{ row.fg }};white-space:nowrap;overflow:hidden\">{{ row.name }}<\u002Fdiv>\n                    <sc-for list=\"{{ row.cells }}\" as=\"c\" hint-placeholder-count=\"8\">\n                      <div style=\"width:64px;flex:none;height:26px;position:relative\">\n                        <sc-if value=\"{{ c.isClk }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div>\n                            <div style=\"position:absolute;left:0;width:50%;top:2px;border-top:1.5px solid oklch(0.42 0.01 258)\"><\u002Fdiv>\n                            <div style=\"position:absolute;left:50%;width:50%;top:22px;border-top:1.5px solid oklch(0.42 0.01 258)\"><\u002Fdiv>\n                            <div style=\"position:absolute;left:50%;top:2px;height:20px;border-left:1.5px solid oklch(0.42 0.01 258)\"><\u002Fdiv>\n                            <div style=\"position:absolute;left:0;top:2px;height:20px;border-left:1.5px solid oklch(0.42 0.01 258)\"><\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ c.isBit }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div>\n                            <div style=\"position:absolute;left:0;right:0;top:{{ c.top }}px;border-top:1.5px solid {{ c.col }}\"><\u002Fdiv>\n                            <sc-if value=\"{{ c.edge }}\" hint-placeholder-val=\"{{ false }}\">\n                              <div style=\"position:absolute;left:0;top:2px;height:20px;border-left:1.5px solid {{ c.col }}\"><\u002Fdiv>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ c.isBus }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div>\n                            <div style=\"position:absolute;left:0;width:64px;top:3px;height:19px;background:{{ c.col }};clip-path:{{ c.clipOuter }}\"><\u002Fdiv>\n                            <div style=\"position:absolute;left:0;width:64px;top:3px;height:19px;background:{{ c.bg }};clip-path:{{ c.clipInner }}\"><\u002Fdiv>\n                            <div style=\"position:absolute;left:0;width:64px;top:3px;height:19px;display:flex;align-items:center;padding-left:9px;box-sizing:border-box;font:400 9px/1 'JetBrains Mono',monospace;letter-spacing:.04em;color:{{ c.fg }};white-space:nowrap\">{{ c.text }}<\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ c.isX }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"position:absolute;left:0;right:0;top:12px;border-top:1.5px dashed oklch(0.36 0.01 258)\"><\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"margin-top:34px\">\n            <div style=\"font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:oklch(0.48 0.01 258);margin-bottom:14px\">TRACE<\u002Fdiv>\n            <div style=\"border:1px solid oklch(0.26 0.011 258);border-radius:12px;background:oklch(0.155 0.012 258);overflow:hidden\">\n              <sc-for list=\"{{ trace }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:flex-start;gap:16px;padding:12px 20px;border-top:1px solid oklch(0.22 0.01 258)\">\n                  <div style=\"font:400 11px/1.5 'JetBrains Mono',monospace;color:oklch(0.52 0.01 258);width:34px;flex:none\">T{{ t.cyc }}<\u002Fdiv>\n                  <div style=\"font:500 11px/1.5 'JetBrains Mono',monospace;color:{{ t.stFg }};width:92px;flex:none\">{{ t.state }}<\u002Fdiv>\n                  <div style=\"font:400 12px/1.5 'JetBrains Mono',monospace;color:oklch(0.66 0.008 258);flex:1;text-wrap:pretty\">{{ t.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRef }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font:400 11px/1 'JetBrains Mono',monospace;letter-spacing:.22em;color:oklch(0.72 0.15 300)\">REFERENCE<\u002Fdiv>\n          <div style=\"font-size:40px;font-weight:700;letter-spacing:-.022em;margin:16px 0 20px\">{{ refTitle }}<\u002Fdiv>\n          <div style=\"font-size:17px;line-height:1.65;color:oklch(0.72 0.008 258);max-width:76ch;text-wrap:pretty\">{{ refProse }}<\u002Fdiv>\n          <div style=\"margin-top:30px;border:1px solid oklch(0.26 0.011 258);border-radius:12px;background:oklch(0.155 0.012 258);overflow:hidden;max-width:900px\">\n            <sc-for list=\"{{ refRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex;align-items:flex-start;gap:18px;padding:14px 22px;border-top:1px solid oklch(0.22 0.01 258)\">\n                <div style=\"font:500 12px/1.5 'JetBrains Mono',monospace;color:{{ r.aFg }};width:170px;flex:none\">{{ r.a }}<\u002Fdiv>\n                <div style=\"font:400 11px/1.6 'JetBrains Mono',monospace;color:oklch(0.58 0.01 258);width:96px;flex:none\">{{ r.b }}<\u002Fdiv>\n                <div style=\"font-size:14px;line-height:1.6;color:oklch(0.66 0.008 258);flex:1;text-wrap:pretty\">{{ r.c }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startLevel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;L1&quot;,&quot;L2&quot;,&quot;L3&quot;,&quot;L4&quot;,&quot;L5&quot;,&quot;L6&quot;,&quot;L7&quot;,&quot;L8&quot;],&quot;default&quot;:&quot;L2&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Model&quot;},&quot;showWaveform&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Model&quot;},&quot;clockMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:140,&quot;max&quot;:1200,&quot;step&quot;:20,&quot;default&quot;:520,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Model&quot;},&quot;waveCycles&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:6,&quot;max&quot;:20,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Model&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    const lv = this.props.startLevel || 'L2';\n    this.state = { level: lv, view: 'net', addr: '0x40004000', wr: true, data: '0x00000041',\n      prot: { priv: true, ns: false, inst: false }, sel: null,\n      ph: 'IDLE', cyc: 0, waitLeft: 0, trace: [], running: false, mem: {} };\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  /* ---------- static model ---------- */\n  get LEVELS() {\n    return [\n      { id: 'L1', name: 'One requester, one completer', rev: 'APB2', title: 'Two blocks, four wires',\n        prose: 'One APB requester, one completer, no decode anywhere. PSEL is hardwired, so whatever the requester drives lands here. The whole protocol is two cycles: SETUP asserts PSEL with PADDR and PWRITE, then ACCESS adds PENABLE and moves the data. Everything later on this page is this picture with more of it.',\n        note: 'APB2 has no PREADY. The completer cannot stall, so every transfer is exactly two cycles and the requester must assume its data was taken.',\n        cols: [['req'], ['uart0']] },\n      { id: 'L2', name: 'Fan-out', rev: 'APB2', title: 'One address, sixteen PSELs',\n        prose: 'Insert a slave multiplexer. Address and control fan out untouched: PADDR, PWRITE, PWDATA and PENABLE are four broadcast rails every completer taps. Nothing comes back shared, though — read data is not a shared bus. Each completer drives its own PRDATA, PREADY and PSLVERR into its own port group on the mux, and the mux forwards exactly one set, the selected completer\\u2019s, upstream. Distribution on APB is address decode plus a bundle of PSELs: no arbitration, no IDs, no reordering.',\n        note: 'This is the CMSDK-style APB slave mux, and the same job the CoreLink NIC-400 APB AMIB does across up to 16 subports. Because everything is broadcast, adding a completer costs one PSEL wire and one decode line — which is exactly why APB is the configuration bus of choice.',\n        cols: [['req'], ['mux'], ['timer0', 'uart0', 'wdog', 'gpio0']] },\n      { id: 'L3', name: 'Address map holes', rev: 'APB2', title: 'Sixteen slots, four filled',\n        prose: 'The decode covers 0x4000_0000 to 0x4000_FFFF in sixteen 4KB slots, and most of them are empty. Aim at 0x4000_3000 and no PSEL asserts at all: the transfer has nowhere to land. A default completer is wired to every unclaimed slot so the requester still gets an answer instead of hanging.',\n        note: 'An unmapped access is a decode question, not a protocol one. The mux decides before any handshake happens, which is why the default completer has to be part of the address map rather than bolted on afterwards.',\n        cols: [['req'], ['mux'], ['timer0', 'uart0', 'wdog', 'gpio0', 'dflt']] },\n      { id: 'L4', name: 'Wait states', rev: 'APB3', title: 'PREADY stretches ACCESS',\n        prose: 'APB3 adds PREADY. The completer can now hold ACCESS for as long as it needs, and the requester waits with PENABLE high and the address still driven. UART0 takes two wait states here, WDOG one, TIMER0 none — so the same transfer costs a different number of cycles depending only on where it is going.',\n        note: 'PREADY is per completer, and the mux simply muxes it back to the requester. One slow peripheral therefore blocks the whole APB bus, which is why anything latency sensitive does not live behind it.',\n        cols: [['req'], ['mux'], ['timer0', 'uart0', 'wdog', 'gpio0', 'dflt']] },\n      { id: 'L5', name: 'Error responses', rev: 'APB3', title: 'PSLVERR, and who asserts it',\n        prose: 'Two different failures look the same to software. The default completer asserts PSLVERR because nothing is mapped at that address. WDOG asserts PSLVERR because it is a real completer refusing a real access: its registers are locked until 0x1ACCE551 is written to LOCK at offset 0xC00. Write the key first, then the write to LOAD succeeds.',\n        note: 'PSLVERR is sampled with PREADY, in the last ACCESS cycle only — an error is a property of the completed transfer, not a separate response phase. Upstream, a bridge turns it into an AHB HRESP error or an AXI SLVERR.',\n        cols: [['req'], ['mux'], ['timer0', 'uart0', 'wdog', 'gpio0', 'dflt']] },\n      { id: 'L6', name: 'Cascaded decode', rev: 'APB3', title: 'A subsystem behind a subsystem',\n        prose: 'Slot 0xC does not hold a peripheral — it holds another mux. The first decode picks the subsystem from PADDR[15:12], the second picks the peripheral inside it from PADDR[11:8]. Nothing about the transfer changes, it just passes through one more level of PSEL generation.',\n        note: 'Cascading is how a large peripheral space stays routable without a 64-way decode at the top: each level fans out a little and adds, at most, a cycle of combinational delay. NIC-400 allows the equivalent through cascaded switch networks upstream of the APB AMIB.',\n        cols: [['req'], ['mux'], ['timer0', 'uart0', 'wdog', 'submux', 'dflt'], ['rtc', 'ssp']] },\n      { id: 'L7', name: 'Upstream bridge', rev: 'APB3', title: 'Where an AHB transfer becomes an APB one',\n        prose: 'The real requester is a core on AHB-Lite. The bridge is the only component that speaks both: it takes one AHB transfer, holds the core off, and produces the SETUP and ACCESS pair on the APB side. Address outside 0x4000_xxxx and the upstream decode never selects the bridge, so nothing enters the APB network at all.',\n        note: 'This is the CMSDK AHB-to-APB bridge; the AXI equivalent is the NIC-400 APB AMIB, which additionally handles the 32-bit fixed APB data width and converts PSLVERR into AXI SLVERR. Both are also clock-domain boundaries in most designs — the APB side commonly runs at a divided clock.',\n        cols: [['cpu'], ['bridge'], ['mux'], ['timer0', 'uart0', 'wdog', 'gpio0', 'dflt']] },\n      { id: 'L8', name: 'Protection filtering', rev: 'APB4', title: 'PPROT decides before PSEL does',\n        prose: 'APB4 adds PPROT[2:0]: privileged, non-secure, instruction. A peripheral protection controller sits in front of the mux and checks those bits against per-peripheral rules before any PSEL is generated. WDOG is secure-only, GPIO0 is privileged-only. A blocked access never reaches its completer — the PPC answers with PSLVERR instead.',\n        note: 'This is the pattern used by TrustZone-M subsystems such as SSE-200, where AHB and APB PPCs gate peripheral space and their own configuration registers sit behind another PPC. APB4 also adds PSTRB, though a 32-bit configuration bus rarely uses it.',\n        cols: [['req'], ['ppc'], ['mux'], ['timer0', 'uart0', 'wdog', 'gpio0', 'dflt']] }\n    ];\n  }\n  get ND() {\n    return {\n      cpu: { label: 'CPU_M4', sub: 'AHB-Lite requester', range: 'core', note: 'A Cortex-M class core. It issues a single AHB-Lite transfer and is stalled by HREADY until the APB side finishes, so every wait state below is visible in the core\\u2019s own cycle count.' },\n      req: { label: 'APB_REQ', sub: 'APB requester', range: 'drives PADDR/PWRITE', note: 'The APB requester. It drives PADDR, PWRITE, PWDATA and PSEL, and runs the two-phase SETUP / ACCESS state machine. In real silicon this is always a bridge from AHB or AXI — APB has no bus master of its own.' },\n      bridge: { label: 'AHB2APB', sub: 'AHB-to-APB bridge', range: 'protocol + clock', note: 'CMSDK-style AHB-to-APB bridge. It converts one AHB-Lite transfer into an APB SETUP/ACCESS pair, holds HREADY low meanwhile, and typically crosses into a slower APB clock domain.' },\n      ppc: { label: 'APB_PPC', sub: 'protection controller', range: 'checks PPROT', note: 'Peripheral protection controller. It compares PPROT[2:0] against per-peripheral security and privilege rules and blocks the access before decode. Blocked transfers get PSLVERR from the PPC, never from the peripheral.' },\n      mux: { label: 'APB_MUX', sub: 'decode PADDR[15:12]', range: '0x4000_0000 +64KB', note: 'The APB slave multiplexer. It decodes PADDR[15:12] into 16 PSEL lines and muxes PRDATA, PREADY and PSLVERR back. Address, write data and PENABLE are broadcast to all completers unchanged.' },\n      submux: { label: 'APB_MUX_1', sub: 'decode PADDR[11:8]', range: '0x4000_C000 +4KB', note: 'A second-level mux inside slot 0xC. It decodes PADDR[11:8] to select within the subsystem — same component, one address field lower.' },\n      dflt: { label: 'DEFAULT_SLV', sub: 'error responder', range: 'unmapped slots', note: 'Default completer, wired to every unclaimed decode slot. It answers immediately with PSLVERR so an unmapped access is reported rather than hanging the bus.' },\n      timer0: { label: 'TIMER0', sub: 'CMSDK timer', base: 0x40000000, psel: 0x0, waits: 0, note: 'A 32-bit down counter. No wait states: the registers are a single flop stage behind the bus.',\n        regs: [[0x0, 'CTRL', 0], [0x4, 'VALUE', 0], [0x8, 'RELOAD', 0x0000FFFF], [0xC, 'INTSTATUS', 0]] },\n      uart0: { label: 'UART0', sub: 'PL011-style UART', base: 0x40004000, psel: 0x4, waits: 2, note: 'A UART. Two wait states, because the register file sits behind a synchroniser into the UART\\u2019s own clock domain.',\n        regs: [[0x0, 'DATA', 0], [0x4, 'STATE', 0x00000002], [0x8, 'CTRL', 0x00000003], [0xC, 'INTSTATUS', 0]] },\n      wdog: { label: 'WDOG', sub: 'SP805-style watchdog', base: 0x40008000, psel: 0x8, waits: 1, secure: true, note: 'A watchdog. Its registers are locked until 0x1ACCE551 is written to LOCK at offset 0xC00; any other write returns PSLVERR. Secure-only once PPROT filtering is in play.',\n        regs: [[0x0, 'LOAD', 0x00FFFFFF], [0x4, 'VALUE', 0x00FFFFFF], [0x8, 'CTRL', 0], [0xC00, 'LOCK', 1]] },\n      gpio0: { label: 'GPIO0', sub: 'PL061-style GPIO', base: 0x4000A000, psel: 0xA, waits: 0, priv: true, note: 'A GPIO block. Privileged-only once PPROT filtering is in play, so unprivileged code cannot flip pins.',\n        regs: [[0x0, 'DATA', 0], [0x4, 'DATAOUT', 0], [0x10, 'OUTENSET', 0]] },\n      rtc: { label: 'RTC', sub: 'PL031-style RTC', base: 0x4000C000, psel: 0xC, sub2: 0x0, waits: 1, note: 'Inside the subsystem at slot 0xC, window 0x0. Reached through two levels of decode.',\n        regs: [[0x0, 'DR', 0x5F2C1A80], [0x8, 'LR', 0], [0xC, 'CR', 1]] },\n      ssp: { label: 'SSP', sub: 'PL022-style SPI', base: 0x4000C100, psel: 0xC, sub2: 0x1, waits: 0, note: 'Inside the subsystem at slot 0xC, window 0x1.',\n        regs: [[0x0, 'CR0', 0x00000007], [0x8, 'DR', 0], [0xC, 'SR', 0x00000003]] }\n    };\n  }\n  get VIEWS() { return [['net', 'Network & trace', 'oklch(0.80 0.15 155)'], ['sig', 'APB signals', 'oklch(0.74 0.14 245)'], ['map', 'Address map', 'oklch(0.72 0.15 300)'], ['rules', 'Rules & mapping', 'oklch(0.85 0.15 90)']]; }\n\n  /* ---------- helpers ---------- */\n  hex(n, d) { return '0x' + (n >>> 0).toString(16).toUpperCase().padStart(d || 8, '0'); }\n  parseHex(s) { const v = parseInt(String(s).trim().replace(/^0x/i, '').replace(/_/g, ''), 16); return isNaN(v) ? 0 : v >>> 0; }\n  get lvl() { return this.LEVELS.find(l => l.id === this.state.level) || this.LEVELS[1]; }\n  get ids() { const o = []; this.lvl.cols.forEach(c => c.forEach(i => o.push(i))); return o; }\n  get rev() { return this.lvl.rev; }\n  get addrV() { return this.parseHex(this.state.addr); }\n  memVal(id, off) {\n    const k = id + ':' + off, m = this.state.mem;\n    if (k in m) return m[k];\n    const d = (this.ND[id].regs || []).find(r => r[0] === off);\n    return d ? d[2] : 0;\n  }\n  regName(id, off) { const r = (this.ND[id].regs || []).find(x => x[0] === off); return r ? r[1] : 'offset ' + this.hex(off, 3); }\n\n  /* ---------- decode ---------- */\n  decode() {\n    const L = this.lvl, ids = this.ids, ND = this.ND, a = this.addrV, p = this.state.prot;\n    const has = i => ids.indexOf(i) >= 0;\n    let chain = [], target = null, err = null, why = '';\n    if (has('cpu')) {\n      chain.push('cpu');\n      if ((a >>> 16) !== 0x4000) return
